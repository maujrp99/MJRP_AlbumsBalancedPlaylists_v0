<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album Blender Design System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* the site's own Home stylesheet (public/css/views/home.css): the fire button and the equalizer, alive on the page itself */
/*HOME_CSS*/
</style>
<style>
/* Layout: the site's black and nothing else; the identity on the first screen, then one section per subject,
   reached from a small index; each piece in live frames drawn with the site's own CSS. Dark only, by choice:
   it is the site's one theme (design-system.md § Temas). Every value below is the site's (tokens named). */
:root {
  color-scheme: dark;
  --bg: #000000;            /* preto */
  --panel: #101014;         /* painel, --home-panel */
  --surface: #1c1c22;       /* superfície */
  --line: rgba(255, 255, 255, 0.12);  /* linha, --home-line */
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.72); /* --home-muted */
  --soft: rgba(255, 255, 255, 0.64);  /* --home-soft */
  --orange: #f97316;        /* laranja */
  --red: #dc2626;           /* vermelho */
  --fire: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
  --pink: #fca5a5;          /* rosa: o que não entrou */
  --green: #4ade80;
  --title: 'Syne', system-ui, sans-serif;
  --sys: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--sys); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--text); text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 2px; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* the header: brand, the index (scrolls when narrow, with a fade that says so), the approve button apart */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(0, 0, 0, 0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 16px/1 var(--title); white-space: nowrap; text-decoration: none; min-height: 44px; }
.brand img { width: 28px; height: 28px; object-fit: contain; }
nav.idx { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); padding-right: 24px; }
nav.idx::-webkit-scrollbar { display: none; }
nav.idx a { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 11px; border-radius: 999px; color: var(--muted); font: 700 13px/1 var(--title); text-decoration: none; white-space: nowrap; }
nav.idx a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.approve { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--fire); color: #fff; font: 800 14px/1 var(--title); text-decoration: none; white-space: nowrap; }
.approve b { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); font: 700 13px/1 var(--sys); }
main { padding-block: 0 64px; }

/* 1. the opening: the identity on one screen, shown */
.open { padding-block: 28px 12px; display: grid; gap: 22px; position: relative; align-content: center; min-height: min(760px, calc(100dvh - 56px - env(safe-area-inset-top, 0px))); }
.wordmark { position: relative; display: block; width: min(620px, 100%); height: auto; margin: 0 auto; }
.sw { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.sw li { display: grid; gap: 8px; }
.sw i { display: block; height: 64px; border-radius: 12px; border: 1px solid var(--line); }
.sw span, .open small { font: 700 13px/1.2 var(--title); color: var(--muted); }
.idrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.idrow p { margin: 0; display: flex; align-items: center; gap: 18px; padding: 16px 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); flex-wrap: wrap; }
.type__syne { font: 800 48px/1 var(--title); }
.type__sys { font: 400 48px/1 var(--sys); color: var(--muted); }
.eqrow { display: grid; gap: 6px; justify-items: center; }
.eqrow .home-eq { width: 100%; margin: 0; opacity: 1; }

/* sections */
.fam { padding-block: 40px 8px; border-top: 1px solid var(--line); margin-top: 28px; scroll-margin-top: 64px; }
.open, .comp, .ask { scroll-margin-top: 72px; }
.fam h2 { margin: 0; font: 800 30px/1.15 var(--title); text-wrap: balance; }
.fam .line, .comp .line { margin: 6px 0 18px; color: var(--muted); max-width: 64ch; }
.h3 { margin: 30px 0 12px; font: 800 19px/1.2 var(--title); }
.h3 small { font: 700 13px var(--sys); color: var(--soft); margin-left: 6px; }
.note { color: var(--soft); font-size: 13px; margin: 0 0 12px; max-width: 70ch; }
.rules { margin: 18px 0; padding-left: 18px; display: grid; gap: 8px; max-width: 78ch; color: var(--muted); }
.rules b { color: #fff; }
.rules i { color: var(--soft); font-style: normal; }

/* live frames */
.pair { display: grid; grid-template-columns: minmax(0, 960fr) minmax(0, 390fr); gap: 16px; align-items: start; margin-bottom: 14px; }
.pair--wide { grid-template-columns: minmax(0, 1fr); }
.pair--phone { grid-template-columns: minmax(0, 390px); }
.pair--ask { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.frame { margin: 0; min-width: 0; }
.frame figcaption { font: 700 12px/1 var(--title); color: var(--soft); margin-bottom: 8px; letter-spacing: 0.04em; }
.frame__box { position: relative; width: 100%; max-width: 100%; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #000; aspect-ratio: calc(var(--w) / var(--h)); }
.frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #000; }

/* colours */
.toks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 12px; }
.tok { display: grid; gap: 4px; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.tok i { display: block; height: 52px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 4px; }
.tok b { font: 700 14px/1.2 var(--title); }
.tok span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.tok code { color: var(--soft); }
.toks--mini { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.toks--mini i { height: 32px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: #fff; font-weight: 700; }
td { color: var(--muted); }
td.n { font-variant-numeric: tabular-nums; color: #fff; white-space: nowrap; }
.ct td { vertical-align: middle; }
.aa { display: inline-grid; place-items: center; width: 36px; height: 30px; border-radius: 6px; margin-right: 4px; font: 800 15px var(--title); border: 1px solid var(--line); }
.warn { color: var(--pink); }
.scroll { overflow-x: auto; margin: 8px 0 12px; }
code { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #e4e4e7; overflow-wrap: anywhere; }

/* type */
.scale p { margin: 0 0 10px; line-height: 1.2; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.scale small { color: var(--soft); font-size: 12px; font-variant-numeric: tabular-nums; }

/* space and shape */
.shapes { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px; }
.shape { display: grid; grid-template-rows: 64px auto auto; gap: 4px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.shape b { font: 700 14px/1.2 var(--title); }
.shape span { font-size: 13px; color: var(--muted); }
.demo { align-self: center; display: block; width: 64px; height: 48px; background: var(--surface); border: 1px solid rgba(255, 255, 255, 0.14); }
.demo--gap { display: flex; gap: var(--g); background: none; border: 0; width: auto; }
.demo--gap b { width: 28px; height: 44px; border-radius: 6px; background: var(--surface); }
.demo--glass { width: 120px; border-radius: 14px; background: linear-gradient(rgba(8, 8, 10, 0.78), rgba(8, 8, 10, 0.78)), var(--fire); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

/* motion */
.calm { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14); background: var(--surface); color: #fff; font: 700 14px var(--title); cursor: pointer; }
.calm[aria-pressed="true"] { background: #fff; color: #000; }
html.calm-on .home-eq i { animation: none !important; transform: none !important; }

/* components */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.chips a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.14); color: #d4d4d8; font: 700 13px var(--title); text-decoration: none; }
.chips a:hover { background: #fff; color: #000; }
.comp { padding-top: 28px; }
.comp h3 { margin: 0; font: 800 21px/1.2 var(--title); }
.finding { display: block; margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: rgba(220, 38, 38, 0.1); box-shadow: inset 3px 0 0 #f87171; color: var(--muted); font-size: 13px; max-width: 90ch; }
.finding__tag { margin-right: 8px; font: 700 12px var(--title); color: var(--pink); letter-spacing: 0.04em; }

/* copy */
.words td b { color: #fff; }
.words s { color: var(--soft); text-decoration-color: #f87171; }
.rulers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 14px; }
.rule { padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.rule h3 { margin: 0 0 12px; font: 800 18px/1.2 var(--title); }
.rule h3 small { display: block; margin-top: 4px; font: 400 13px var(--sys); color: var(--soft); }
.ex { margin: 0 0 12px; display: grid; gap: 6px; }
.ex__tag { font: 700 12px var(--title); letter-spacing: 0.04em; }
.ex--good .ex__tag { color: var(--green); }
.ex--bad .ex__tag { color: var(--pink); }
.ex q { font-size: 15px; color: #fff; quotes: "«" "»"; }
.ex small { color: var(--soft); font-size: 12px; }
.meter { display: flex; align-items: flex-end; gap: 2px; height: 22px; flex-wrap: wrap; }
.meter i { width: 6px; height: 100%; border-radius: 2px 2px 0 0; background: rgba(255, 255, 255, 0.12); }
.meter i.ok { background: linear-gradient(to top, #dc2626, #f97316); }
.meter i.mid { background: #dc2626; }
.meter i.over { background: rgba(252, 165, 165, 0.5); height: 55%; }
.meter i.cap { box-shadow: 3px 0 0 -1px #fff; }

/* what waits for him */
.ask { padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(249, 115, 22, 0.45); margin: 18px 0 14px; }
.ask h3 { margin: 0 0 4px; font: 800 19px/1.2 var(--title); }
.ask .q { margin: 0 0 8px; font-size: 16px; color: #fff; }
.ask .rec { margin: 0 0 14px; padding: 8px 12px; border-radius: 10px; background: rgba(249, 115, 22, 0.12); font: 700 14px/1.4 var(--title); }
.body1 { margin: 0; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: #000; font-size: 16px; line-height: 1.5; color: var(--muted); }
.pends { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 14px; }
.pend { padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); min-width: 0; display: grid; gap: 10px; align-content: start; }
.pend--wide { grid-column: 1 / -1; }
.pend h4 { margin: 0; font: 800 16px/1.25 var(--title); }
.pend .chg { margin: 0; font-size: 13px; color: var(--muted); }
.covers { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.covers img { width: 72px; height: 72px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
.covers small { flex-basis: 100%; font-size: 12px; color: var(--muted); }

/* the details, closed, each named for what it holds */
.det { margin-top: 12px; font: 400 13px/1.45 var(--sys); color: var(--muted); }
.det summary { cursor: pointer; width: max-content; max-width: 100%; min-height: 44px; display: inline-flex; align-items: center; font: 700 13px/1.2 var(--title); color: var(--soft); }
.det summary:hover { color: #fff; }
footer { color: var(--soft); font: 400 12px/1.4 var(--sys); padding-block: 24px; border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  .pair { grid-template-columns: minmax(0, 1fr); }
  .pair--phone { grid-template-columns: minmax(0, 1fr); max-width: 390px; }
  .idrow { grid-template-columns: 1fr; }
  .sw { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw i { height: 44px; }
  .brand span { display: none; }
  .type__syne, .type__sys { font-size: 40px; }
  .fam h2 { font-size: 26px; }
  .approve { padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .home-eq i { animation: none !important; } }
</style>

    <!--NAV-->
  </nav>
  <a class="approve" href="#aprovar"><!--APPROVE--></a>
</div></header>

<script>
const CSS = { app: /*CSS_APP*/null, splash: /*CSS_SPLASH*/null };
const PROTO = /*PROTO*/null;
const FONT = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap">';
const BASE = 'html,body{margin:0;background:#000;color:#fff}html{overflow:hidden}';
const CALM = '<style id="calm">*,*::before,*::after{animation:none!important;transition:none!important}</style>';
let calm = false;
/* each frame: the template's markup in a document of its own, with the site's CSS, at its real width; scaled to the column */
function draw(iframe) {
  const tpl = document.getElementById(iframe.dataset.tpl);
  const w = Number(iframe.getAttribute('width'));
  const body = iframe.dataset.css === 'splash' ? '' : ' class="bg-black text-white font-syne"';
  iframe.srcdoc = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=' + w + '">' + FONT +
    '<style>' + CSS[iframe.dataset.css] + '</style><style>' + BASE + '</style>' + (calm ? CALM : '') + '</head><body' + body + '>' + tpl.innerHTML + '</body></html>';
}
/* the home prototype (v4), one copy for every frame; the prototype's own switch bar hidden, the account state chosen */
const protoUrl = {};
function protoSrc(state) {
  const key = state + (calm ? '-calm' : '');
  if (!protoUrl[key]) {
    const extra = '<style>.proto{display:none!important}</style>' + (calm ? CALM : '') +
      (state === 'in' ? '<script>addEventListener("DOMContentLoaded",function(){var b=document.querySelector(".proto [data-state=in]");if(b)b.click()})<\/script>' : '');
    const html = PROTO.replace('</head>', extra + '</head>');
    protoUrl[key] = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  }
  return protoUrl[key];
}
function drawProto(iframe) {
  if (iframe.dataset.pw && innerWidth < 600) {
    iframe.setAttribute('width', iframe.dataset.pw); iframe.setAttribute('height', iframe.dataset.ph);
    const fig = iframe.closest('.frame'); fig.style.setProperty('--w', iframe.dataset.pw); fig.style.setProperty('--h', iframe.dataset.ph);
    fig.querySelector('figcaption').textContent = 'Celular · 390 (protótipo)'; fit();
  }
  iframe.src = protoSrc(iframe.dataset.state || '') + (iframe.dataset.proto || ''); }
function fit() {
  document.querySelectorAll('.frame__box').forEach((box) => {
    const iframe = box.querySelector('iframe');
    if (!iframe) return;
    const k = box.clientWidth / Number(iframe.getAttribute('width'));
    iframe.style.transform = 'scale(' + k + ')';
  });
}
document.querySelectorAll('iframe[data-tpl]').forEach(draw);
const protos = [...document.querySelectorAll('iframe[data-proto]')];
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) { drawProto(e.target); io.unobserve(e.target); } }), { rootMargin: '600px 0px' });
  protos.forEach((f) => io.observe(f));
} else protos.forEach(drawProto);
fit();
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
/* «Ver com menos movimento»: the page and every frame drawn again without motion, as the site does with the system preference */
const calmBtn = document.getElementById('calm');
if (calmBtn) calmBtn.addEventListener('click', () => {
  calm = !calm;
  calmBtn.setAttribute('aria-pressed', String(calm));
  calmBtn.textContent = calm ? 'Ver com movimento' : 'Ver com menos movimento';
  document.documentElement.classList.toggle('calm-on', calm);
  document.querySelectorAll('iframe[data-tpl]').forEach(draw);
  protos.forEach((f) => { if (f.src) drawProto(f); });
});
</script>
