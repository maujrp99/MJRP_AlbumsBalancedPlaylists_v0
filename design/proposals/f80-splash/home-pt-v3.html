<!doctype html>
<html lang="pt-BR"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home em português v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one question (the owner's rule of 2026-11-21: one decision, little text). v3 live beside the picture of v2;
   everything older behind one link. Single dark world. */
:root{
  color-scheme:dark;
  --bg:#0a0908;--panel:#15120f;--line:#2c2620;--fg:#f4efe9;--muted:#b9aea2;--accent:#f97316;--accent-text:#fb923c;--chip:#221c16;
  --display:'Syne',system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:fit-content;max-width:100%}
.seg button{min-height:44px;padding:0 16px;border-radius:8px;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 0 0 1px #3b3128}
button:focus-visible,a:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.views figure{margin:0;border:1px solid var(--line);border-radius:12px;background:#000;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.views figure.rec{border-color:var(--accent)}
.views h2{font:800 18px/1.2 var(--display);margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.views h2 .tag{font:700 11px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.views p{margin:0;color:var(--muted);font-size:14px}
.views a{color:var(--accent-text)}
.live{position:relative;width:100%;overflow:hidden;border-radius:6px;background:#000}
.live iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0}
.pic{display:block;border-radius:6px;overflow:hidden}
.pic img{display:block;width:100%;height:auto}
.more{color:var(--accent-text);display:inline-flex;align-items:center;min-height:44px;width:fit-content}
@media (max-width:560px){.views{grid-template-columns:1fr}}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap">

<div class="shell">
  <h1>O texto em português ficou natural?</h1>
  <p class="sub">A abertura é a sua; o resto revisei com as suas notas.</p>
  <div class="bar">
    <div class="seg" id="langs" role="group" aria-label="Idioma da página">
      <button type="button" data-l="pt" aria-pressed="true">PT</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" id="states" role="group" aria-label="Quem abre a página">
      <button type="button" data-s="out" aria-pressed="true">Sem conta</button>
      <button type="button" data-s="in" aria-pressed="false">Com conta</button>
    </div>
  </div>
  <section class="views" aria-label="A versão nova e a que você viu">
    <figure class="rec">
      <h2>v3<span class="tag">Nova</span></h2>
      <div class="live" id="live"><iframe id="v3" title="A v3, a página viva" loading="eager"></iframe></div>
      <p>Role dentro da página para ler tudo. <a id="v3open" href="splash-menu-bar-v3.html" target="_blank" rel="noopener">Abrir inteira →</a></p>
    </figure>
    <figure>
      <h2>v2<span class="tag" style="color:var(--muted)">A que você viu</span></h2>
      <a class="pic" id="v2a" href="splash-menu-bar-v2.html" target="_blank" rel="noopener"><picture><source id="v2s" media="(max-width:560px)"><img id="v2i" alt="A v2, sem conta" width="640" height="400"></picture></a>
      <p>O texto antes das suas notas.</p>
    </figure>
  </section>
  <a class="more" href="index.html">← Voltar à pergunta de agora</a>
  <a class="more" href="rodadas-anteriores.html">Rodadas anteriores →</a>
</div>

<script>
// The decision in hand (2026-11-21): is the Portuguese natural now? v3 runs live; v2 is the picture at the «Álbuns» story,
// opening the live page.
let st = 'out', lang = 'pt'
const $ = (id) => document.getElementById(id)
const frame = $('v3'), live = $('live')
const q = (extra) => { const p = [st === 'in' ? 'in=1' : '', lang === 'en' ? 'lang=en' : '', ...extra].filter(Boolean).join('&'); return p ? '?' + p : '' }
// the preview is the page at a real width (1280 on a computer, 393 on a phone), scaled to the card
function fit() {
  const phone = innerWidth <= 560, W = phone ? 393 : 1280, Hh = phone ? 852 : 800
  const s = live.clientWidth / W
  frame.style.width = W + 'px'; frame.style.height = Hh + 'px'; frame.style.transform = `scale(${s})`
  live.style.height = Math.round(Hh * s) + 'px'
}
function load() { frame.src = 'splash-menu-bar-v3.html' + q([]); $('v3open').href = frame.src }
function render() {
  document.querySelectorAll('#states button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === st)))
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)))
  const img = (w) => `caps/v2-${lang}-${st}-${w}-albums.webp`
  $('v2s').srcset = img(393); $('v2i').src = img(1280)
  $('v2i').alt = `A v2, ${st === 'in' ? 'com conta' : 'sem conta'}`
  $('v2a').href = 'splash-menu-bar-v2.html' + q([])
  load()
}
$('states').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st = b.dataset.s; render() })
$('langs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; render() })
addEventListener('resize', fit); new ResizeObserver(fit).observe(live)
fit(); render()
</script>
