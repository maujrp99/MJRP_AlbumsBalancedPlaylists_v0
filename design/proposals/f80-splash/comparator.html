<!doctype html>
<html lang="pt-BR"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página de entrada</title>
<style>
/* Layout: one question (the owner's rule of 2026-11-21: one decision, little text). v4 beside v3, both live, the phone
   view first (he looks on the iPhone); everything older behind one link. Single dark world. */
:root{
  color-scheme:dark;
  --bg:#0a0908;--panel:#15120f;--line:#2c2620;--fg:#f4efe9;--muted:#b9aea2;--accent:#f97316;--accent-text:#fb923c;--chip:#221c16;
  --display:'Syne',system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:fit-content;max-width:100%}
.seg button{min-height:44px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 0 0 1px #3b3128}
button:focus-visible,a:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.views.phone{grid-template-columns:repeat(2,minmax(0,393px));justify-content:center}
.views figure{margin:0;border:1px solid var(--line);border-radius:12px;background:#000;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.views figure.rec{border-color:var(--accent)}
.views h2{font:800 18px/1.2 var(--display);margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.views h2 .tag{font:700 11px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.views h2 .tag.seen{color:var(--muted)}
.views p{margin:0;color:var(--muted);font-size:14px}
.views a{color:var(--accent-text);display:inline-flex;align-items:center;min-height:44px}
.live{position:relative;width:100%;overflow:hidden;border-radius:6px;background:#000}
.live iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0}
.more{color:var(--accent-text);display:inline-flex;align-items:center;min-height:44px;width:fit-content}
@media (max-width:560px){.views,.views.phone{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap">

<div class="shell">
  <h1>O ritmo da página ficou vivo, sem vazio?</h1>
  <p class="sub">Histórias mais curtas, e cada uma com uma vinheta de fogo e música que aparece quando ela entra.</p>
  <div class="bar">
    <div class="seg" id="sizes" role="group" aria-label="Tamanho da tela">
      <button type="button" data-w="phone" aria-pressed="true">Celular</button>
      <button type="button" data-w="desk" aria-pressed="false">Computador</button>
    </div>
    <div class="seg" id="langs" role="group" aria-label="Idioma da página">
      <button type="button" data-l="pt" aria-pressed="true">PT</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" id="states" role="group" aria-label="Quem abre a página">
      <button type="button" data-s="out" aria-pressed="true">Sem conta</button>
      <button type="button" data-s="in" aria-pressed="false">Com conta</button>
    </div>
  </div>
  <section class="views phone" id="views" aria-label="A versão nova e a que você viu">
    <figure class="rec">
      <h2>v4<span class="tag">Nova</span></h2>
      <div class="live"><iframe data-v="v4" title="A v4, a página viva" loading="eager"></iframe></div>
      <p>Role dentro dela. <a data-open="v4" href="splash-menu-bar-v4.html" target="_blank" rel="noopener">Abrir inteira →</a></p>
    </figure>
    <figure>
      <h2>v3<span class="tag seen">A que você viu</span></h2>
      <div class="live"><iframe data-v="v3" title="A v3, a página viva" loading="lazy"></iframe></div>
      <p>Role dentro dela. <a data-open="v3" href="splash-menu-bar-v3.html" target="_blank" rel="noopener">Abrir inteira →</a></p>
    </figure>
  </section>
  <a class="more" href="rodadas-anteriores.html">Rodadas anteriores →</a>
</div>

<script>
// The decision in hand (2026-11-21): is the scroll alive now, with no void? v4 and v3 both live, the phone first.
let st = 'out', lang = 'pt', size = 'phone'
const $$ = (s) => [...document.querySelectorAll(s)]
const q = (embed) => { const p = [embed ? 'embed=1' : '', st === 'in' ? 'in=1' : '', lang === 'en' ? 'lang=en' : ''].filter(Boolean).join('&'); return p ? '?' + p : '' }
// each preview is the page at a real width (393 phone, 1280 computer), scaled to its card
function fit() {
  const phone = size === 'phone', W = phone ? 393 : 1280, Hh = phone ? 852 : 800
  $$('.live').forEach((live) => {
    const f = live.querySelector('iframe'), s = Math.min(1, live.clientWidth / W)
    f.style.width = W + 'px'; f.style.height = Hh + 'px'; f.style.transform = `scale(${s})`
    live.style.height = Math.round(Hh * s) + 'px'
  })
}
function render() {
  $$('#sizes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === size)))
  $$('#langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)))
  $$('#states button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === st)))
  document.getElementById('views').classList.toggle('phone', size === 'phone')
  $$('iframe[data-v]').forEach(f => { f.src = `splash-menu-bar-${f.dataset.v}.html` + q(true) })
  $$('a[data-open]').forEach(a => { a.href = `splash-menu-bar-${a.dataset.open}.html` + q(false) })
  fit()
}
const pick = (id, key, set) => document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset[key]); render() })
pick('sizes', 'w', v => { size = v }); pick('langs', 'l', v => { lang = v }); pick('states', 's', v => { st = v })
addEventListener('resize', fit); new ResizeObserver(fit).observe(document.getElementById('views'))
render()
</script>
