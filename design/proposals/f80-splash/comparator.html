<meta charset="utf-8">
<title>Página de entrada F80</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the decision in hand only. One question, four pictures side by side (today and the three views), one pose switch; everything older behind one link. Single dark world: the product is dark. */
:root{
  color-scheme:dark;
  --bg:#0a0908;--panel:#15120f;--line:#2c2620;--fg:#f4efe9;--muted:#b9aea2;--accent:#f97316;--accent-text:#fb923c;--chip:#221c16;
  --display:'Syne',system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:fit-content;max-width:100%}
.seg button{min-height:44px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 0 0 1px #3b3128}
button:focus-visible,a:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.views figure{margin:0;border:1px solid var(--line);border-radius:12px;background:#000;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.views figure.rec{border-color:var(--accent)}
.views img{display:block;width:100%;height:auto;border-radius:6px}
.views h2{font:800 18px/1.2 var(--display);margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between;white-space:nowrap;overflow:hidden}
.views h2 .tag{font:700 11px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.views p{margin:0;color:var(--muted);font-size:14px}
.more{color:var(--accent-text);display:inline-flex;align-items:center;min-height:44px}
@media (max-width:980px){.views{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.views{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap">

<div class="shell">
  <h1>A caixa de discos: qual vista?</h1>
  <p style="margin:-8px 0 0;color:var(--muted)">A página numa janela de 1920 px.</p>
  <div class="seg" id="poses" role="group" aria-label="Momento da rolagem"></div>
  <section class="views" id="views" aria-label="Hoje e as três vistas"></section>
  <a class="more" href="rodadas-anteriores.html">Rodadas anteriores →</a>
</div>

<script>
// The decision in hand: today's page and the three views of the crate, at the same moment of the scroll, window 1920 × 1080.
const VIEWS = [
  { id:'today', name:'Hoje', line:'De frente; cortada na virada.' },
  { id:'a', name:'1 · Três-quartos', line:'Em diagonal, inteira no quadro.' },
  { id:'b', name:'2 · Palco largo', line:'A mesma diagonal, caixa maior.', rec:true },
  { id:'c', name:'3 · Ângulo forte', line:'Mais 3D; o disco vira de frente.' },
];
const POSES = [['flip','A virada'],['a1','A abertura'],['a3','Um disco puxado'],['b1','O lado B']];
let pose = 'flip';
document.getElementById('poses').innerHTML = POSES.map(([id, label]) => `<button type="button" data-p="${id}" aria-pressed="false">${label}</button>`).join('');
function render(){
  document.querySelectorAll('#poses button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === pose));
  const label = POSES.find(p => p[0] === pose)[1];
  document.getElementById('views').innerHTML = VIEWS.map(v => `<figure${v.rec ? ' class="rec"' : ''}><h2>${v.name}${v.rec ? '<span class="tag">Recomendo</span>' : ''}</h2><img src="d-${v.id}-${pose}.webp" alt="${v.name}: ${label}" width="640" height="536"><p>${v.line}</p></figure>`).join('');
}
document.getElementById('poses').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pose = b.dataset.p; render(); });
render();
</script>
