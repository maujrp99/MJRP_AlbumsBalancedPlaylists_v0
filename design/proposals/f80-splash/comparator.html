<meta charset="utf-8">
<title>Página de entrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the decision in hand only (the owner's rule of 2026-11-21: open on one question, little text). One question, one switch, four pictures (today and the three previews) that open the live page; everything older behind one link. Single dark world: the product is dark. */
:root{
  color-scheme:dark;
  --bg:#0a0908;--panel:#15120f;--line:#2c2620;--fg:#f4efe9;--muted:#b9aea2;--accent:#f97316;--accent-text:#fb923c;--chip:#221c16;
  --display:'Syne',system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--text)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 26px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:fit-content;max-width:100%}
.seg button{min-height:44px;padding:0 16px;border-radius:8px;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 0 0 1px #3b3128}
button:focus-visible,a:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.views figure{margin:0;border:1px solid var(--line);border-radius:12px;background:#000;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.views figure.rec{border-color:var(--accent)}
.views a.pic{display:block;border-radius:6px;overflow:hidden}
.views img{display:block;width:100%;height:auto}
.views h2{font:800 18px/1.2 var(--display);margin:0;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.views h2 .tag{font:700 11px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.views p{margin:0;color:var(--muted);font-size:14px}
.more{color:var(--accent-text);display:inline-flex;align-items:center;min-height:44px;width:fit-content}
@media (max-width:980px){.views{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.views{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap">

<div class="shell">
  <h1>A home: como o menu e a barra se juntam?</h1>
  <div class="seg" id="states" role="group" aria-label="Quem abre a página">
    <button type="button" data-s="out" aria-pressed="true">Sem conta</button>
    <button type="button" data-s="in" aria-pressed="false">Com conta</button>
  </div>
  <section class="views" id="views" aria-label="Hoje e as três prévias"></section>
  <a class="more" href="rodadas-anteriores.html">Rodadas anteriores →</a>
</div>

<script>
// The decision in hand (2026-11-21): today's home and three previews on one axis, how far the menu and the bar merge.
// Each picture is the page at the «Albums» story (1280 on a computer, 393 on a phone) and opens the live page.
const VIEWS = [
  { id:'today', name:'Hoje', line:'Barra em grupos; a mesma página com ou sem conta.', file:'home-menu-hoje.html' },
  { id:'a', name:'Fio com paradas', line:'Barra contínua sob o topo, com o menu.', file:'splash-menu-stops-v1.html' },
  { id:'b', name:'O menu é a barra', line:'O menu no topo; o fogo enche item a item.', file:'splash-menu-bar-v1.html', rec:true },
  { id:'c', name:'Barra embaixo', line:'Uma barra com agulha, embaixo, como no celular.', file:'splash-menu-deck-v1.html' },
];
let st = 'out';
try { if (location.hash === '#com-conta') st = 'in'; } catch (e) {}
function render(){
  document.querySelectorAll('#states button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === st)));
  const who = st === 'in' ? 'com conta' : 'sem conta';
  document.getElementById('views').innerHTML = VIEWS.map(v => {
    const s = v.id === 'today' ? 'out' : st;
    const href = v.file + (s === 'in' ? '?in=1' : '');
    return `<figure${v.rec ? ' class="rec"' : ''}><h2>${v.name}${v.rec ? '<span class="tag">Recomendo</span>' : ''}</h2>`
      + `<a class="pic" href="${href}" target="_blank" rel="noopener" aria-label="Abrir ${v.name}, ${who}, a página viva"><picture>`
      + `<source media="(max-width:560px)" srcset="caps/${v.id}-${s}-393-albums.webp">`
      + `<img src="caps/${v.id}-${s}-1280-albums.webp" alt="${v.name}, ${who}" width="640" height="400" loading="lazy"></picture></a>`
      + `<p>${v.line}</p></figure>`;
  }).join('');
}
document.getElementById('states').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st = b.dataset.s; try { history.replaceState(null, '', st === 'in' ? '#com-conta' : location.pathname); } catch (err) {} render(); });
render();
</script>
