<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receitas do Blend</title>
<meta name="description" content="F92 · v1: a tela de Blend com as receitas do catálogo (Deep cuts com o deslizador, As menos ouvidas) e a seção Receitas do Painel, com o construtor por blocos. Hoje ao lado da proposta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/*
 * F92 · prototype v1 (mjrp-designing-ui, converge, one round). ONE file, the comparator itself: four tabs, each with today («Referência»)
 * beside the proposal. The frame around the screens follows the viewer's light or dark; the screens themselves stay dark, because The Album
 * Blender has one dark theme (docs/specs/design-system.md § Themes, D-08). Site tokens: design-system.md § Cores and models/recipeLooks.js;
 * Panel tokens: public/css/admin-skin.css (the --ak-* skin) and the Panel's own .cms-* layout.
 */
:root{
  --c-bg:#f6f5f3; --c-panel:#ffffff; --c-raised:#efede9; --c-text:#17171a; --c-soft:#55555d; --c-line:rgba(0,0,0,.14);
  --c-accent:#c2410c; --c-accent-soft:rgba(249,115,22,.14); --c-on-accent:#ffffff;
  --syne:"Syne",system-ui,-apple-system,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --c-bg:#0a0a0c; --c-panel:#101014; --c-raised:#1c1c22; --c-text:#ffffff; --c-soft:#a0a0a8; --c-line:rgba(255,255,255,.14); --c-accent:#fb923c; --c-accent-soft:rgba(249,115,22,.16); --c-on-accent:#0b0b0b; }
}
:root[data-theme="dark"]{ --c-bg:#0a0a0c; --c-panel:#101014; --c-raised:#1c1c22; --c-text:#ffffff; --c-soft:#a0a0a8; --c-line:rgba(255,255,255,.14); --c-accent:#fb923c; --c-accent-soft:rgba(249,115,22,.16); --c-on-accent:#0b0b0b; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--c-bg);color:var(--c-text);font:15px/1.5 var(--sys);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2}
:focus-visible{outline:2px solid #fb923c;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== the comparator's frame ===== */
.wrap{max-width:1600px;margin:0 auto;padding:0 24px}
@media (max-width:767px){ .wrap{padding:0 16px} }
.top{padding-top:22px;padding-bottom:10px}
.brandline{font:700 13px/1.4 var(--syne);color:var(--c-soft)}
.top h1{font:800 30px/1.15 var(--syne);margin:4px 0 6px}
.top p{margin:0;color:var(--c-soft);max-width:80ch}
.top .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px;border-bottom:1px solid var(--c-line);padding-bottom:10px}
.tab{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-panel);font:700 14px var(--syne);color:var(--c-text)}
.tab[aria-selected="true"]{background:var(--c-text);color:var(--c-bg);border-color:var(--c-text)}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--c-soft)}
.tools label{display:inline-flex;align-items:center;gap:6px;min-height:44px;max-width:100%}
.tools select{min-height:44px;max-width:min(100%,520px);min-width:0;padding:0 10px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);font-size:15px}
.seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--c-line);background:var(--c-panel)}
.seg button{min-height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--c-soft);font:700 13px var(--syne)}
.seg button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent)}
.ghostbtn{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);font-weight:700;font-size:13px}
.say{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--c-accent);background:var(--c-panel);border-radius:0 10px 10px 0;font-size:14px;max-width:110ch}
.say b{color:var(--c-text)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;padding-bottom:40px}
.cols.one{grid-template-columns:minmax(0,1fr)}
.cols.ph{grid-template-columns:repeat(2,minmax(0,390px));justify-content:center}
.cols.ph.one{grid-template-columns:minmax(0,390px)}
@media (max-width:899px){ .cols,.cols.ph{grid-template-columns:minmax(0,1fr)} .cols.ph,.cols.ph.one{grid-template-columns:minmax(0,390px)} .col.is-new{order:-1} }
.col{min-width:0}
.col h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font:800 16px/1.3 var(--syne);margin:0 0 8px}
.col h2 small{font:400 12px var(--sys);color:var(--c-soft)}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font:700 11px/18px var(--sys);border:1px solid var(--c-line)}
.pill.new{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.fit{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--c-line);background:#000}
.fit-in{transform-origin:0 0;container-type:inline-size}
.prop-on .prop{text-decoration:underline dashed rgba(251,146,60,.85);text-decoration-thickness:1px;text-underline-offset:3px}
.ids-on [data-inv]{outline:1px dashed rgba(251,146,60,.9);outline-offset:2px;position:relative}
.ids-on [data-inv]::after{content:attr(data-inv);position:absolute;top:-9px;right:-4px;z-index:9;padding:0 4px;border-radius:4px;background:#fb923c;color:#0b0b0b;font:700 10px/14px ui-monospace,Menlo,monospace;pointer-events:none;white-space:nowrap}
.ids-on [data-inv=""]{outline:0}.ids-on [data-inv=""]::after{display:none}

/* ===== THE SITE (one dark theme): the Blend screen ===== */
.site{background:#000;color:#fff;font-family:var(--syne);min-height:100%}
.site .muted{color:#a0a0a8}
.site button{color:#fff}
.s-nav{display:flex;align-items:center;gap:22px;height:64px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.1);background:#0a0a0c}
.s-brand{font:800 18px var(--syne);background:linear-gradient(90deg,#f97316,#dc2626);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-menu{display:flex;gap:18px;font:700 14px var(--syne);color:rgba(255,255,255,.72)}
.s-menu .cur{color:#fb923c}
.s-av{margin-left:auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f97316,#dc2626);color:#0b0b0b;font:800 14px/34px var(--syne);text-align:center}
.s-wrap{max-width:1024px;margin:0 auto;padding:32px 16px 40px}
.s-head{text-align:center;margin-bottom:32px}
.s-title{display:inline-flex;align-items:center;gap:12px;margin-bottom:12px}
.s-title span{font-size:36px}
.s-title h1{font:700 36px/1.1 var(--syne);background:linear-gradient(90deg,#fb923c,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-motto{color:#a0a0a8;font-size:18px;margin:0 0 24px}
.stepper{display:inline-flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.st{display:flex;align-items:center;gap:8px}
.st-m{display:flex;flex-direction:column;align-items:center}
.st-c{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#a0a0a8;display:grid;place-items:center}
.st-c .i{width:22px;height:22px}
.st-c.done{background:#22c55e;border-color:#22c55e;color:#fff}
.st-c.cur{background:#fb923c;border-color:#fb923c;color:#000;box-shadow:0 10px 15px -3px rgba(251,146,60,.3)}
.st-l{font-size:12px;margin-top:4px;color:#a0a0a8}
.st-l.done{color:#4ade80}.st-l.cur{color:#fb923c;font-weight:700}
.st-line{width:32px;height:2px;background:rgba(255,255,255,.2)}.st-line.done{background:#22c55e}
.glass{background:rgba(10,10,12,.6);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.37);border-radius:16px;padding:24px;margin-bottom:24px}
.glass.locked{opacity:.4}
.glass.go{border:2px solid rgba(251,146,60,.3)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hd .i{width:32px;height:32px;color:#fb923c}
.hd h2{font:700 20px var(--syne)}
.stepb{font-size:12px;color:#a0a0a8;padding:4px 8px;background:rgba(255,255,255,.05);border-radius:999px}
.lockhd{display:flex;align-items:center;gap:12px}.lockhd h2{font:400 20px var(--syne);color:#a0a0a8}
.s-lbl{display:block;font-size:14px;margin-bottom:12px;color:#a0a0a8}
.s-lbl .i{width:16px;height:16px;vertical-align:-3px;margin-right:8px}
.s-select{width:100%;padding:12px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(28,28,34,.6);color:#fff;font-size:15px;margin-bottom:24px}
.series{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ser{display:flex;align-items:center;gap:12px;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:left}
.ser.on{border-color:#fb923c;background:rgba(251,146,60,.1);box-shadow:0 0 0 1px #fb923c}
.ser h4{font:400 15px var(--syne)}.ser.on h4{color:#fb923c}
.ser p{margin:0;font-size:12px;color:#a0a0a8}
.casc{display:flex;flex:none}.casc i{display:block;width:34px;height:34px;border-radius:4px;border:1px solid rgba(0,0,0,.5);margin-left:-14px;box-shadow:2px 0 4px rgba(0,0,0,.5)}.casc i:first-child{margin-left:0}
/* recipe cards (ui/recipe/RecipeCards.tsx + models/recipeLooks.js) */
.rcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rc{position:relative;display:block;width:100%;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:left;font-family:var(--syne)}
.rc:hover{border-color:rgba(255,255,255,.2)}
.rc.rec{border-color:rgba(251,191,36,.4);background:linear-gradient(135deg,rgba(120,53,15,.1),rgba(124,45,18,.05))}
.rc.sel{border-color:#fbbf24;box-shadow:0 0 0 2px #fb923c,0 10px 15px -3px rgba(251,146,60,.2)}
.rc-top{position:absolute;top:-8px;left:50%;transform:translateX(-50%);padding:2px 8px;font-size:10px;font-weight:700;border-radius:999px;background:#fbbf24;color:#000;white-space:nowrap}
.rc-icw{display:flex;justify-content:center;margin-bottom:12px}
.rc-ic{width:48px;height:48px;margin:0 auto 8px;border-radius:12px;display:grid;place-items:center;box-shadow:0 10px 15px -3px rgba(0,0,0,.4);color:#fff}
.rc-ic .i{width:24px;height:24px}
.rc h4{font:700 16px/1.3 var(--syne);margin:0 0 4px}
.rc.sel h4,.rc.rec h4{color:#fbbf24}
.rc-pill{display:inline-block;padding:2px 8px;font-size:10px;border-radius:999px;margin-bottom:8px;font-weight:700}
.rc p{margin:0;font-size:11px;line-height:1.35;color:#a0a0a8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ingredients (ui/recipe/Ingredients.tsx) */
.ingr{display:grid;gap:24px}
.tcg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tcb{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);font:700 14px var(--syne);text-align:center}
.tcb.on{border-color:#fb923c;background:rgba(251,146,60,.2);color:#fb923c;box-shadow:0 0 0 1px #fb923c}
.hint{font-size:12px;color:#a0a0a8;margin:8px 0 0}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:left;font-family:var(--syne)}
.opt.on{border-color:#fb923c;background:rgba(251,146,60,.1);box-shadow:0 0 0 1px #fb923c}
.opt .ob{flex:none;width:40px;height:40px;border-radius:8px;background:rgba(28,28,34,.6);display:grid;place-items:center;color:#a0a0a8}
.opt.on .ob{color:#fb923c}.opt .ob .i{width:20px;height:20px}
.opt b{display:block;font-weight:400}.opt.on b{color:#fb923c}
.opt small{font-size:12px;color:#a0a0a8}
.gb{display:block;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:left;font-family:var(--syne)}
.gb.on{border-color:#fb923c;background:rgba(251,146,60,.1);box-shadow:0 0 0 1px #fb923c}
.gb span{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px}.gb.on span{color:#fb923c}
.gb .i{width:16px;height:16px;color:#a0a0a8}.gb.on .i{color:#fb923c}
.gb small{display:block;font-size:10px;line-height:1.25;color:#a0a0a8}
.slide{display:flex;align-items:center;gap:16px}
.slide input{flex:1;accent-color:#fb923c;min-height:44px}
.slide output{font:700 24px var(--syne);color:#fb923c;min-width:48px;text-align:center}
/* NEW (F92): the skip of «Deep cuts» — the number, what it means and the strip of positions */
.skipv{display:grid;justify-items:center;min-width:72px}
.skipv output{font:700 28px/1 var(--syne);color:#fb923c}
.skipv small{font-size:11px;color:#a0a0a8;margin-top:4px;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{height:28px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--syne)}
.cell.sk{background:rgba(255,255,255,.07);color:#a0a0a8;text-decoration:line-through}
.cell.in{background:#fb923c;color:#0b0b0b}
.cell.rest{border:1px dashed rgba(255,255,255,.22);color:#a0a0a8}
.stripkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:11px;color:#a0a0a8}
.stripkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gen-wrap{text-align:center;padding:16px 0}
.gen{padding:16px 32px;font:800 18px var(--syne);border-radius:12px;text-transform:uppercase;letter-spacing:.1em;border:1px solid #ff8800;background:linear-gradient(90deg,rgba(255,136,0,.2),rgba(255,136,0,.4) 50%,rgba(255,136,0,.2));color:#fff}
.gen .i{width:20px;height:20px;vertical-align:-3px;margin-right:8px}
.sum{font-size:14px;color:#a0a0a8;margin:16px 0 0}.sum b{color:#fff}
/* the phone (public/css/mobile.css, mobile/blend.css) */
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:#000;font-family:var(--sys)}
.ph-top{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(8,8,10,.92);border-bottom:1px solid rgba(255,255,255,.1);z-index:3}
.ph-top b{font:800 17px var(--syne)}
.ph-top .s-av{margin:0;width:32px;height:32px;line-height:32px}
.ph-scroll{position:absolute;top:52px;left:0;right:0;bottom:128px;overflow-y:auto;padding:20px 16px 24px}
.ph-scroll .glass{padding:16px;margin-bottom:16px}
.ph-scroll .hd{margin-bottom:12px}.ph-scroll .hd h2{font-size:18px}.ph-scroll .hd .i{width:26px;height:26px}
.ph-scroll .s-head{margin-bottom:20px}
.ph-scroll .s-title span{font-size:26px}.ph-scroll .s-title h1{font-size:26px}
.ph-scroll .s-motto{font-size:15px;margin-bottom:14px}
.ph-scroll .stepper{gap:6px;padding:10px 12px}
.ph-scroll .st{gap:4px}.ph-scroll .st-c{width:32px;height:32px}.ph-scroll .st-c .i{width:18px;height:18px}
.ph-scroll .st-l{font-size:10px}.ph-scroll .st-line{width:14px}
.pick-l{font-size:13px;color:#a0a0a8;margin:0 0 8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px;border-radius:12px;border:1px solid #fb923c;background:rgba(251,146,60,.08);text-align:left}
.pick .t{flex:1;min-width:0}.pick .t b{display:block;font:700 15px var(--syne);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick .t small{color:#a0a0a8;font-size:13px}
.pick .a{font:700 14px var(--sys);color:#fb923c}
.phone .rcs{grid-template-columns:minmax(0,1fr)}
.phone .rc{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:14px;align-items:start;padding:16px}
.phone .rc-icw{grid-column:1;grid-row:1/span 3;margin:0}
.phone .rc-ic{margin:0}
.phone .rc h4,.phone .rc .rc-pill,.phone .rc p{grid-column:2;justify-self:start}
.phone .rc p{font:14px/1.4 var(--sys);-webkit-line-clamp:unset;display:block}
.phone .opts,.phone .opts.g4{grid-template-columns:minmax(0,1fr)}
.phone .tcb{padding:10px 0;min-height:44px}
.phone .s-lbl{font:14px var(--sys)}
.phone .hint{font:13px/1.4 var(--sys)}
.ph-bar{position:absolute;left:0;right:0;bottom:64px;min-height:64px;display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(8,8,10,.92);border-top:1px solid rgba(255,255,255,.12);z-index:3}
.ph-bar span{flex:1;min-width:0;font-size:14px;line-height:18px;color:rgba(255,255,255,.8)}
.ph-bar button{flex:1;min-width:0;min-height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#f97316,#dc2626);color:#0b0b0b;font:800 16px var(--syne)}
.ph-bar button[disabled]{opacity:.45}
.ph-tabs{position:absolute;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(5,1fr);background:#0a0a0c;border-top:1px solid rgba(255,255,255,.12);z-index:3}
.ph-tabs span{display:grid;justify-items:center;align-content:center;gap:2px;font:700 12px/14px var(--sys);color:rgba(255,255,255,.72)}
.ph-tabs span .i{width:20px;height:20px}
.ph-tabs .cur{color:#fb923c}

/* ===== THE PANEL (/admin): the kit's skin of The Album Blender (public/css/admin-skin.css) and the Panel's .cms-* ===== */
[data-admin-skin]{
  --ak-bg:#0a0a0c; --ak-panel:#101014; --ak-panel-2:#1c1c22; --ak-fg:#ffffff; --ak-soft:#a0a0a8; --ak-line:rgba(255,255,255,.18);
  --ak-accent:#f97316; --ak-accent-fg:#0b0b0b; --ak-accent-soft:rgba(249,115,22,.18);
  --ak-ok:#4ade80; --ak-ok-soft:rgba(74,222,128,.14); --ak-warn:#fca5a5; --ak-warn-soft:rgba(220,38,38,.14);
  --ak-err:#f87171; --ak-err-soft:rgba(220,38,38,.16); --ak-new:#fb923c; --ak-new-soft:rgba(249,115,22,.16);
  --ak-preview-bg:#000000; --ak-preview-fg:#ffffff; --ak-display:"Syne",system-ui,sans-serif;
  --ak-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ak-mono:ui-monospace,SFMono-Regular,Menlo,monospace; --ak-radius:12px;
  background:var(--ak-bg);color:var(--ak-fg);font:400 14px/1.5 var(--ak-sans);min-height:100%
}
[data-admin-skin] button{color:var(--ak-fg)}
.cms{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:900px}
.cms-rail{display:flex;flex-direction:column;gap:4px;padding:16px 10px;background:var(--ak-panel);border-right:1px solid var(--ak-line)}
.cms-who{display:flex;align-items:center;gap:10px;padding:0 8px 12px}
.cms-who small{display:block;color:var(--ak-soft);font-size:12px}
.cms-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ak-accent);color:var(--ak-accent-fg);font:700 15px var(--ak-display)}
