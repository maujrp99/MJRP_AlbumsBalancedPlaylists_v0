<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu do Album Blender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* tokens: docs/specs/design-system.md (the home v4 values: splash-menu-bar-v4.html) */
:root{
  --bg:#0a0a0c;--panel:#121216;--panel2:#18181d;--line:rgba(255,255,255,.12);
  --orange:#f97316;--orange-text:#fb923c;--red:#dc2626;--amber:#fbbf24;
  --text:#fff;--muted:#b9b9c2;--faint:#9a9aa4;--danger:#f87171;--spotify:#1ed760;--apple:#fa2d48;
  --flame:linear-gradient(135deg,#f97316 0%,#dc2626 100%);
  --fire-up:linear-gradient(0deg,#dc2626,#f97316 60%,#fbbf24);
  --display:'Syne',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
/* the site is dark only, by identity (black and fire): one look in both themes */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body)}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ===================== comparator page ===================== */
.page{max-width:1320px;margin:0 auto;padding:28px 16px 64px}
.q{font:800 clamp(26px,5.6vw,44px)/1.08 var(--display);letter-spacing:-.01em;margin:0 0 10px;max-width:20ch}
.q em{font-style:normal;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 18px;max-width:60ch}
.switches{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:#0f0f13}
.seg button{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:#a0a0a8;font:600 15px/1 var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:#2a2a30;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tog{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#0f0f13;color:#d6d6dc;font:600 15px/1 var(--body);cursor:pointer}
.tog .box{width:34px;height:20px;border-radius:10px;background:#2a2a30;position:relative;flex:0 0 auto}
.tog .box::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#a0a0a8;transition:left .15s}
.tog[aria-pressed="true"] .box{background:#7c2d12}
.tog[aria-pressed="true"] .box::after{left:17px;background:var(--orange-text)}
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.cards.desk{grid-template-columns:1fr}
@media (min-width:1100px){.cards.desk{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;min-width:0}
.card.rec{border-color:rgba(249,115,22,.55);box-shadow:0 0 0 1px rgba(249,115,22,.25),0 0 40px rgba(249,115,22,.08)}
.card h2{font:800 24px/1.1 var(--display);margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:13px;font:700 13px/1 var(--body);background:var(--flame);color:#0b0b0b}
.badge.ref{background:#2a2a30;color:#d6d6dc}
.card p{margin:0 0 12px;color:#d6d6dc;font-size:15px}
.card .why{color:var(--orange-text);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:10px 22px;margin:22px 0 0}
.links a{display:inline-flex;align-items:center;min-height:44px;color:#fff;font-weight:600;text-decoration:underline;text-decoration-color:rgba(251,146,60,.7);text-underline-offset:5px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:8px}
.back:hover{color:#fff}
h1.view{font:800 clamp(24px,4.6vw,34px)/1.1 var(--display);margin:0 0 8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 14px}
.ctl .lab{font:600 13px/1 var(--body);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.grid-states{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:18px}
.grid-states.desk{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.st h3{font:700 15px/1.3 var(--body);margin:0 0 8px;color:#e6e6ea}
.notes{max-width:820px}
.notes h2{font:800 22px/1.2 var(--display);margin:28px 0 10px}
.notes table{width:100%;border-collapse:collapse;font-size:14px}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.notes th{color:var(--faint);font-weight:600}
.notes li{margin:6px 0}
.small{font-size:13px;color:var(--faint)}
[hidden]{display:none!important}

/* ===================== the device frame ===================== */
.frame{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.frame.p{border-radius:28px}
.vp{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);font:400 16px/1.45 var(--body)}
.vp .scr{position:absolute;left:0;right:0;overflow:hidden;background:#000}
.vp .scr img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.vp .refimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.refnote{position:absolute;left:8px;bottom:8px;z-index:60;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.75);color:#d6d6dc;font:600 12px/1.2 var(--body)}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:90;max-width:88%;padding:10px 14px;border-radius:12px;background:#1f1f25;border:1px solid var(--line);color:#fff;font:600 14px/1.3 var(--body);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.p .toast{top:70px}
.skip{position:absolute;left:8px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:#fff;color:#000;font-weight:700}
.skip:focus{top:8px}
.home-link{display:inline-flex;align-items:center;min-height:44px;flex:0 0 auto;border-radius:6px}
.wm{display:block;height:30px;width:auto}
.p .wm{height:22px}
/* shared buttons (the home's) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;min-width:44px;padding:0 16px;border-radius:12px;font:800 16px/1 var(--display);text-decoration:none;white-space:nowrap;cursor:pointer;border:0}
.btn-primary{background:var(--flame);color:#0b0b0b;box-shadow:0 0 24px rgba(249,115,22,.32)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.62);color:#fff;font-weight:700}
.btn-ghost:hover{border-color:#fff}
.eqi{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.eqi i{width:3px;border-radius:1px;background:#0b0b0b;height:var(--h)}
.eqi i:nth-child(1){--h:55%}.eqi i:nth-child(2){--h:100%}.eqi i:nth-child(3){--h:70%}.eqi i:nth-child(4){--h:40%}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:22px;overflow:hidden;flex:0 0 auto}
.lang button{min-width:44px;min-height:44px;border:0;background:transparent;color:#d6d6dc;font:700 13px/1 var(--body);letter-spacing:.04em;cursor:pointer}
.lang button[aria-pressed="true"]{background:#2a2a30;color:#fff}
.p .lang button{min-width:44px;min-height:44px}
@keyframes eqb{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.moving .eqi i{animation:eqb .8s ease-in-out infinite alternate}
.moving .eqi i:nth-child(2){animation-duration:.93s;animation-delay:-.3s}
.moving .eqi i:nth-child(3){animation-duration:.62s;animation-delay:-.5s}
.moving .eqi i:nth-child(4){animation-duration:1.08s;animation-delay:-.2s}
/* generic bars (the equalizer row of the home) */
.bars{display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.bars i{flex:1 1 0;min-width:1px;border-radius:1px 1px 0 0;background:rgba(255,255,255,.2);height:var(--h);transform-origin:center bottom}
.bars i.on{background:var(--fire-up)}
.moving .bars i.cur{animation:eqb var(--d) ease-in-out var(--o) infinite alternate}
/* account bits */
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--flame);color:#0b0b0b;font:800 15px/1 var(--display);flex:0 0 auto}
.dots{position:absolute;right:-2px;bottom:-2px;display:flex;gap:2px}
.dots b{width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.dots .sp{background:var(--spotify)}.dots .am{background:var(--apple)}
.glyph{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;flex:0 0 auto}
.glyph.sp{background:#000;border-radius:50%;box-shadow:inset 0 0 0 2px var(--spotify)}
.glyph.am{background:linear-gradient(160deg,#fb5c74,#fa233b)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ===================== ELEVAR ===================== */
.e-top{position:absolute;left:0;right:0;top:0;height:72px;z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.e-nav{display:flex;align-items:stretch;gap:4px;margin:0 auto}
.e-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:56px;padding:6px 14px 0;border:0;background:transparent;color:var(--muted);font:600 15px/1 var(--body);text-decoration:none;border-radius:8px;cursor:pointer;white-space:nowrap}
.e-item:hover{color:#fff}
.e-item .lb{display:inline-flex;align-items:center;gap:5px}
.e-item .chev{width:14px;height:14px}
.e-item .bars{width:100%;height:12px;gap:2px}
.e-item.cur{color:var(--orange-text)}
.e-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sp-pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:12px;border:1px solid rgba(30,215,96,.6);background:transparent;color:var(--spotify);font:700 14px/1 var(--body);cursor:pointer;white-space:nowrap}
.sp-pill.on{background:rgba(30,215,96,.1)}
.sp-pill .x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-14px;border:0;border-radius:10px;background:transparent;color:rgba(30,215,96,.85);cursor:pointer}
.sp-pill .x:hover{color:#fff}
.acct-btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;padding:0 10px 0 6px;border-radius:22px;border:1px solid transparent;background:transparent;cursor:pointer;color:#fff;font:600 14px/1 var(--body)}
.acct-btn:hover{border-color:var(--line)}
.acct-btn .nm{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:absolute;z-index:50;min-width:240px;padding:8px;border-radius:14px;background:#141418;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.pop a,.pop button.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#e6e6ea;font:600 15px/1.2 var(--body);text-align:left;text-decoration:none;cursor:pointer}
.pop a:hover,.pop button.row:hover{background:rgba(255,255,255,.06)}
.pop .cur{color:var(--orange-text)}
.pop [aria-disabled="true"]{color:#8a8a94;cursor:default}
.pop [aria-disabled="true"]:hover{background:transparent}
.soon{margin-left:auto;padding:3px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.22);font:600 12px/1 var(--body);color:#b9b9c2}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop .who{padding:8px 12px 10px;font:400 13px/1.3 var(--body);color:var(--muted)}
.pop .who b{display:block;color:#fff;font:700 16px/1.3 var(--display)}
.danger{color:var(--danger)!important}
/* Elevar, phone */
.p .e-top{height:56px;padding:0 8px 0 16px;gap:10px}
.e-name{font:700 17px/22px var(--display);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.e-menu-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:#fff;flex:0 0 auto}
.e-tabs{position:absolute;left:0;right:0;bottom:0;height:68px;z-index:30;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.e-tabs .bars{position:absolute;left:0;right:0;top:0;height:8px;gap:1px}
.e-tabs nav{display:grid;grid-template-columns:repeat(5,1fr);height:100%;padding-top:8px}
.e-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:#a0a0a8;text-decoration:none;font:700 12px/16px var(--body);cursor:pointer;border:0;background:transparent}
.e-tab.cur{color:var(--orange-text)}

/* ===================== TRANSFORMAR (the home's bar, kept) ===================== */
.t-top{position:absolute;left:0;right:0;top:0;height:72px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 16px;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.t-top .mid{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
nav.ms{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:640px;min-width:0}
.ms .stop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;min-height:52px;text-decoration:none;color:var(--muted);font:600 14px/1 var(--body);border-radius:6px;white-space:nowrap;cursor:pointer;border:0;background:transparent}
.ms .stop:hover{color:#fff}
.ms .stop.done{color:#fff}
.ms .stop.cur{color:var(--orange-text)}
.ms .eqbar{position:absolute;left:0;right:0;bottom:6px;height:16px}
.ms .flipmark{position:absolute;z-index:2;left:60%;top:2px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--faint);font-size:14px;pointer-events:none}
.ms .flipmark.on{color:var(--orange-text)}
.t-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.t-acct{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:transparent;cursor:pointer;color:#fff;padding:0}
.t-acct.in{border-color:transparent}
.t-acct .avatar{width:36px;height:36px}
.t-sub{position:absolute;left:0;right:0;top:72px;height:44px;z-index:29;display:flex;justify-content:center;gap:6px;align-items:center;padding:0 16px;background:rgba(10,10,12,.92);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.t-sub a,.t-sub span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;color:#a0a0a8;font:600 14px/1 var(--body);text-decoration:none;white-space:nowrap;border-radius:8px;cursor:pointer}
.t-sub a:hover{color:#fff}
.t-sub a.cur{color:#fff;box-shadow:inset 0 -2px 0 var(--orange)}
.t-sub span[aria-disabled]{color:#8a8a94;font-weight:400;cursor:default}
.t-sub .soon{margin-left:2px}
/* Transformar, phone */
.p .t-top{height:56px;padding:0 8px 0 16px;gap:8px}
.p .t-sub{top:56px;justify-content:flex-start;padding:0 8px}
.t-bottom{position:absolute;left:0;right:0;bottom:0;height:68px;z-index:30;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.t-bottom nav.ms{max-width:none;height:100%;padding:0 8px}
.t-bottom .ms .stop{justify-content:flex-end;padding:0 0 10px;font-size:12px;min-height:56px;height:100%}
.t-bottom .ms .eqbar{top:10px;bottom:auto;height:20px;left:8px;right:8px}
.t-bottom .ms .flipmark{display:none}
/* the panel (account + connections) */
.panel{width:344px;padding:12px}
.panel .hd{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.panel .hd .avatar{width:44px;height:44px;font-size:18px}
.panel .hd .t1{font:400 13px/1.3 var(--body);color:var(--muted)}
.panel .hd .t2{font:700 17px/1.25 var(--display);color:#fff}
.panel .hint{padding:4px 6px 10px;color:#d6d6dc;font-size:15px}
.panel .sec{padding:10px 6px 6px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.conn{display:flex;align-items:center;gap:12px;padding:6px}
.conn .tx{flex:1 1 auto;min-width:0}
.conn .t2{font:700 15px/1.25 var(--body)}
.conn .t3{font:400 13px/1.3 var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn .t3.ok{color:#86efac}
.conn .btn{min-height:44px;padding:0 14px;font:700 14px/1 var(--body);border-radius:10px}
.linkbtn{background:transparent;border:0;color:#d6d6dc;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 8px;cursor:pointer;font:600 14px/1 var(--body)}
.panel .full{width:100%;min-height:48px;font-size:17px}

/* ===================== sheet (phone, both levels) ===================== */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;max-height:calc(100% - 24px);overflow:auto;overscroll-behavior:contain;background:#141418;border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--line);padding:6px 16px 24px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:6px auto 4px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.sheet .sh h2{font:700 20px/1.2 var(--display);margin:0}
.sheet .row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:4px 0;border:0;background:transparent;color:#e6e6ea;font:400 16px/22px var(--body);text-align:left;cursor:pointer;text-decoration:none}
.sheet .row .t2{font:700 17px/22px var(--display);color:#fff}
.sheet .row .t3{font:400 14px/18px var(--body);color:var(--muted)}
.sheet .row[aria-disabled="true"]{cursor:default}
.sheet .row[aria-disabled="true"] .t2{color:#a0a0a8}
.sheet hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.sheet .panel{width:auto;padding:0}
.closebtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer;color:#fff}

/* ===================== arrival (the passage from the home) ===================== */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fill{from{background:rgba(255,255,255,.2)}to{background:var(--fire-up)}}
.arrive .scr{animation:fadein .45s ease-out both}
.arrive.lv-elevar .e-nav,.arrive.lv-elevar .e-right,.arrive.lv-elevar .e-name,.arrive.lv-elevar .e-menu-btn,.arrive.lv-elevar .e-tabs{animation:fadein .35s ease-out both}
.arrive.lv-transformar .t-right,.arrive.lv-transformar .t-sub{animation:fadein .35s ease-out both}
.arrive.lv-transformar .bars i.on{animation:fill .2s ease-out both;animation-delay:calc(var(--k) * 22ms)}
.arrive.lv-ref .refimg{animation:fadein .12s linear both}
.reduce .scr,.reduce *{animation:none!important;transition:none!important}
.kbd-demo{outline:3px solid var(--amber);outline-offset:3px}
.hot{position:absolute;z-index:40;border-radius:12px;background:transparent;border:0;cursor:pointer}
.hot:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.page{padding-left:0;padding-right:0}.page>*:not(.cards){margin-left:16px;margin-right:16px}.cards{gap:24px}.card{border-radius:0;border-left:0;border-right:0;padding:16px 0}.card>h2,.card>p{padding:0 16px}.card .frame.p{border-radius:0}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const IMG = {"home-in-d": "../proposals/f88-top-menu/caps/home-in-d.jpg", "home-in-p": "../proposals/f88-top-menu/caps/home-in-p.jpg", "home-out-d": "../proposals/f88-top-menu/caps/home-out-d.jpg", "home-out-p": "../proposals/f88-top-menu/caps/home-out-p.jpg", "in-albums-d": "../proposals/f88-top-menu/caps/in-albums-d.jpg", "in-albums-p": "../proposals/f88-top-menu/caps/in-albums-p.jpg", "in-blend-d": "../proposals/f88-top-menu/caps/in-blend-d.jpg", "in-blend-p": "../proposals/f88-top-menu/caps/in-blend-p.jpg", "in-inventory-d": "../proposals/f88-top-menu/caps/in-inventory-d.jpg", "in-inventory-p": "../proposals/f88-top-menu/caps/in-inventory-p.jpg", "in-playlists-d": "../proposals/f88-top-menu/caps/in-playlists-d.jpg", "in-playlists-p": "../proposals/f88-top-menu/caps/in-playlists-p.jpg", "in-start-d": "../proposals/f88-top-menu/caps/in-start-d.jpg", "in-start-p": "../proposals/f88-top-menu/caps/in-start-p.jpg", "out-albums-d": "../proposals/f88-top-menu/caps/out-albums-d.jpg", "out-albums-p": "../proposals/f88-top-menu/caps/out-albums-p.jpg", "out-blend-d": "../proposals/f88-top-menu/caps/out-blend-d.jpg", "out-blend-p": "../proposals/f88-top-menu/caps/out-blend-p.jpg", "out-inventory-d": "../proposals/f88-top-menu/caps/out-inventory-d.jpg", "out-inventory-p": "../proposals/f88-top-menu/caps/out-inventory-p.jpg", "out-playlists-d": "../proposals/f88-top-menu/caps/out-playlists-d.jpg", "out-playlists-p": "../proposals/f88-top-menu/caps/out-playlists-p.jpg", "out-start-d": "../proposals/f88-top-menu/caps/out-start-d.jpg", "out-start-p": "../proposals/f88-top-menu/caps/out-start-p.jpg", "ref-in-albums-p": "../proposals/f88-top-menu/caps/ref-in-albums-p.jpg", "ref-in-blend-p": "../proposals/f88-top-menu/caps/ref-in-blend-p.jpg", "ref-in-inventory-p": "../proposals/f88-top-menu/caps/ref-in-inventory-p.jpg", "ref-in-menu-p": "../proposals/f88-top-menu/caps/ref-in-menu-p.jpg", "ref-in-playlists-p": "../proposals/f88-top-menu/caps/ref-in-playlists-p.jpg", "ref-in-start-d": "../proposals/f88-top-menu/caps/ref-in-start-d.jpg", "ref-in-start-p": "../proposals/f88-top-menu/caps/ref-in-start-p.jpg", "ref-out-albums-d": "../proposals/f88-top-menu/caps/ref-out-albums-d.jpg", "ref-out-albums-p": "../proposals/f88-top-menu/caps/ref-out-albums-p.jpg", "ref-out-blend-d": "../proposals/f88-top-menu/caps/ref-out-blend-d.jpg", "ref-out-blend-p": "../proposals/f88-top-menu/caps/ref-out-blend-p.jpg", "ref-out-inventory-d": "../proposals/f88-top-menu/caps/ref-out-inventory-d.jpg", "ref-out-inventory-p": "../proposals/f88-top-menu/caps/ref-out-inventory-p.jpg", "ref-out-menu-p": "../proposals/f88-top-menu/caps/ref-out-menu-p.jpg", "ref-out-playlists-d": "../proposals/f88-top-menu/caps/ref-out-playlists-d.jpg", "ref-out-playlists-p": "../proposals/f88-top-menu/caps/ref-out-playlists-p.jpg", "ref-out-start-d": "../proposals/f88-top-menu/caps/ref-out-start-d.jpg", "ref-out-start-p": "../proposals/f88-top-menu/caps/ref-out-start-p.jpg", "wordmark": "../proposals/f88-top-menu/caps/wordmark.jpg"};
const LOCK = "elevar";
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- words (PT first; EN from the home's copy and the app's labels) ---------- */
const W = {

    signin:'Entrar', openapp:'Abrir o app', signedAs:'Entrou como', signout:'Sair', menu:'Menu', close:'Fechar',
    conns:'Conexões', connect:'Conectar', disconnect:'Desconectar', connected:'Conectado · conta-teste', notConn:'Para exportar suas playlists',
    clear:'Limpar o cache dos álbuns', newpl:'Novas playlists', newplHint:'As playlists do seu último Blend',
    byAlbum:'Séries de álbuns', byArtist:'Por artista', byGenre:'Por gênero', byTrack:'Por faixa', plSeries:'Séries de playlists', saved:'Salvas', newShort:'Novas',
    sArtist:'Séries por artista', sGenre:'Séries por gênero', sTrack:'Séries por faixa',
    account:'Conta e conexões', sideB:'Lado B: o que você guarda', otherSeries:'Séries por artista, gênero ou faixa · em breve', conOnly:'Conexões', homeStory:'Sem conta, na home, este item leva à história dele na página', soon:'Em breve', otherTypes:'Por artista, gênero ou faixa · em breve', lang:'Idioma', hint:'Entre para guardar suas séries em qualquer aparelho.', name:'Conta de teste',
    skip:'Pular para o conteúdo', homeAria:'The Album Blender, ir para a home', mainNav:'Menu do app', acctAria:'Conta e conexões',
    spOn:'Spotify conectado', spOff:'Spotify não conectado', amOn:'Apple Music conectado', amOff:'Apple Music não conectado' },
  en: { start:'Start', albums:'Albums', blend:'Blend', playlists:'Playlists', inventory:'Inventory',
    signin:'Sign in', openapp:'Open the app', signedAs:'Signed in as', signout:'Sign out', menu:'Menu', close:'Close',
    conns:'Connections', connect:'Connect', disconnect:'Disconnect', connected:'Connected · test-account', notConn:'To export your playlists',
    clear:'Clear album cache', newpl:'New playlists', newplHint:'The playlists of your last blend',
    byAlbum:'Album series', byArtist:'By artist', byGenre:'By genre', byTrack:'By track', plSeries:'Playlist series', saved:'Saved', newShort:'New',
    sArtist:'Series by artist', sGenre:'Series by genre', sTrack:'Series by track',
    account:'Account and connections', sideB:'Side B: what you keep', otherSeries:'Series by artist, genre or track · soon', conOnly:'Connections', homeStory:'On the home, this item scrolls to its story', soon:'Soon', otherTypes:'By artist, genre or track · soon', lang:'Language', hint:'Sign in to keep your series on every device.', name:'Test Account',
    skip:'Skip to content', homeAria:'The Album Blender, go to the home', mainNav:'App menu', acctAria:'Account and connections',
    spOn:'Spotify connected', spOff:'Spotify not connected', amOn:'Apple Music connected', amOff:'Apple Music not connected' }
};
const SCREENS = ['start','albums','blend','playlists','inventory'];
const SLOT = { start:[0,.2], albums:[.2,.4], blend:[.4,.6], playlists:[.6,.8], inventory:[.8,1] };
const SIDE_A = ['start','albums','blend'];
const ICON = {
  start:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  albums:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
  blend:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="15" cy="6" r="2" fill="#0a0a0c"/><circle cx="9" cy="12" r="2" fill="#0a0a0c"/><circle cx="16" cy="18" r="2" fill="#0a0a0c"/>',
  playlists:'<path d="M3 6h12M3 12h12M3 18h8"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M20 17.5V7"/>',
  inventory:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', chev:'<path d="m6 9 6 6 6-6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/>',
  plug:'<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'
};
const ico = (k, cls='ico', size) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"${size?` style="width:${size}px;height:${size}px"`:''}>${ICON[k]}</svg>`;
const spGlyph = `<span class="glyph sp" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#1ed760" stroke-width="2.2" stroke-linecap="round"><path d="M6 9.5c4-1.3 8.5-1 12 1M7 13c3.2-.9 6.8-.6 9.5.9M8 16.2c2.4-.6 5-.4 7 .7"/></svg></span>`;
const amGlyph = `<span class="glyph am" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M16 4v10.2a2.8 2.8 0 1 1-1.6-2.5V7.3L10 8.3v7.9a2.8 2.8 0 1 1-1.6-2.5V5.6z"/></svg></span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* bars: heights, durations and delays of their own, never in unison (design-system § O equalizador) */
function barStyle(k){ const h = 38 + Math.round(58 * Math.abs(Math.sin(k * 1.93 + .4))); const d = (.55 + ((k * 37) % 9) / 10).toFixed(2); const o = (((k * 53) % 7) / 10).toFixed(1); return `--h:${h}%;--d:${d}s;--o:-${o}s;--k:${k}` }
function bars(n, litFn, curFn){ let s=''; for(let k=0;k<n;k++){ const on=litFn(k/n,k), cur=on&&curFn&&curFn(k/n,k); s+=`<i class="${on?'on':''}${cur?' cur':''}" style="${barStyle(k)}"></i>` } return s }

/* ---------- one device ---------- */
let DID = 0;
function Device(host, init){
  const st = Object.assign({ level:'transformar', w:393, screen:'start', acct:'in', sp:false, am:false, lang:'pt', open:null, motion:true, mode:'app', kbd:null, interactive:true, arriving:false }, init);
  const id = 'd' + (++DID);
  host.innerHTML = `<div class="frame"><div class="vp" id="${id}"></div></div>`;
  const frame = host.firstChild, vp = frame.firstChild;
  let lastTrigger = null, toastT = 0, idleT = 0;
  function fit(){ const W0 = st.w === 393 ? 393 : 1280, H0 = st.w === 393 ? 852 : 800; frame.style.maxWidth = W0+'px'; frame.style.margin = '0 auto'; const k = Math.min(1, frame.clientWidth / W0) || 1; vp.style.width = W0+'px'; vp.style.height = H0+'px'; vp.style.transform = `scale(${k})`; frame.style.height = (H0*k)+'px'; frame.classList.toggle('p', st.w===393) }
  new ResizeObserver(fit).observe(frame);
  function toast(msg){ clearTimeout(toastT); let t = vp.querySelector('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); vp.appendChild(t) } t.textContent = msg; toastT = setTimeout(()=>t.remove(), 2600) }
  const L = () => W[st.lang];
  const P = () => st.w === 393;
  function img(screen){ return IMG[`${st.acct}-${screen}-${P()?'p':'d'}`] }

  /* --- Elevar --- */
  function elevarDesk(){
    const l = L(), cur = st.screen;
    const item = (k) => { const c = cur===k; return `<a href="#" class="e-item${c?' cur':''}" data-go="${k}"${c?' aria-current="page"':''}><span class="lb">${l[k]}</span><span class="bars" aria-hidden="true">${bars(14,()=>c,()=>c)}</span></a>` };
    const ddOpen = st.open==='albums-dd', c = cur==='albums';
    const dd = `<div style="position:relative;display:flex"><button type="button" class="e-item${c?' cur':''}" data-open="albums-dd" aria-expanded="${ddOpen}"${c?' aria-current="page"':''}><span class="lb">${l.albums}${ico('chev','ico chev')}</span><span class="bars" aria-hidden="true">${bars(14,()=>c,()=>c)}</span></button>
      ${ddOpen?`<div class="pop" style="left:0;top:62px">
        <a href="#" data-go="albums" class="${c?'cur':''}">${ico('albums')}${l.byAlbum}</a>
        <a aria-disabled="true">${ico('user')}${l.byArtist}<span class="soon">${l.soon}</span></a>
        <a aria-disabled="true">${ico('note')}${l.byGenre}<span class="soon">${l.soon}</span></a>
        <a aria-disabled="true">${ico('list')}${l.byTrack}<span class="soon">${l.soon}</span></a>
        <hr><a href="#" data-go="playlists" data-sub="series">${ico('playlists')}${l.plSeries}</a></div>`:''}</div>`;
    const sp = st.sp ? `<span class="sp-pill on" title="Spotify: conta-teste">${spGlyph}<span>Spotify ✓</span><button type="button" class="x" data-act="sp" aria-label="${l.disconnect} Spotify">${ico('x','ico',14)}</button></span>`
                     : `<button type="button" class="sp-pill" data-act="sp">${spGlyph}<span>${l.connect}</span></button>`;
    const acctOpen = st.open==='acct';
    const acct = st.acct==='in'
      ? `<div style="position:relative"><button type="button" class="acct-btn" data-open="acct" aria-expanded="${acctOpen}" aria-label="${l.acctAria}: ${l.name}"><span class="avatar" aria-hidden="true">T</span><span class="nm">${l.name}</span></button>
         ${acctOpen?`<div class="pop" style="right:0;top:52px"><div class="who">${l.signedAs}<b>${l.name}</b></div><hr><button type="button" class="row danger" data-act="signout">${ico('out')}${l.signout}</button></div>`:''}</div>`
      : `<button type="button" class="btn btn-ghost" data-act="signin">${l.signin}</button>`;
    return `<header class="e-top"><a class="home-link" href="#" data-act="home" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a>
      <nav class="e-nav" aria-label="${l.mainNav}">${item('start')}${dd}${item('blend')}${item('playlists')}${item('inventory')}</nav>
      <div class="e-right">${langPill()}${sp}${acct}</div></header>`;
  }
  function elevarPhone(){
    const l = L(), cur = st.screen;
    const btn = st.acct==='in' ? `<button type="button" class="e-menu-btn" data-open="sheet" aria-haspopup="dialog" aria-label="${l.menu}: ${l.name}"><span class="avatar" aria-hidden="true">T</span></button>`
                               : `<button type="button" class="e-menu-btn" data-open="sheet" aria-haspopup="dialog" aria-label="${l.menu}">${ico('menu','ico',26)}</button>`;
    const i = SCREENS.indexOf(cur);
    const tabs = SCREENS.map(k => `<a href="#" class="e-tab${k===cur?' cur':''}" data-go="${k}"${k===cur?' aria-current="page"':''}>${ico(k)}<span>${l[k]}</span></a>`).join('');
    return `<header class="e-top"><a class="home-link" href="#" data-act="home" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a><span class="e-name">${l[cur]}</span>${btn}</header>
      <div class="e-tabs"><span class="bars" aria-hidden="true">${bars(60,(f)=>f>=i*.2&&f<(i+1)*.2,(f)=>f>=i*.2&&f<(i+1)*.2)}</span><nav aria-label="${l.mainNav}">${tabs}</nav></div>`;
  }
  function elevarSheet(){
    const l = L();
    const head = st.acct==='in' ? `<div class="row" style="cursor:default"><span class="avatar" style="width:44px;height:44px;font-size:18px" aria-hidden="true">T</span><span><span class="t3">${l.signedAs}</span><br><span class="t2">${l.name}</span></span></div>`
                                : `<button type="button" class="btn btn-primary full" style="width:100%;min-height:48px;margin:6px 0" data-act="signin">${l.signin}</button>`;
    const soonRow = (k, ic) => `<div class="row" aria-disabled="true">${ico(ic)}<span class="t2">${l[k]}</span><span class="soon">${l.soon}</span></div>`;
    const sp = st.sp ? `<span class="sp-pill on">${spGlyph}<span>Spotify ✓</span><button type="button" class="x" data-act="sp" aria-label="${l.disconnect} Spotify">${ico('x','ico',14)}</button></span>` : `<button type="button" class="sp-pill" data-act="sp">${spGlyph}<span>${l.connect}</span></button>`;
    return sheetWrap(l.menu, `${head}<hr>
      <a href="#" class="row" data-go="playlists" data-sub="new">${ico('playlists')}<span><span class="t2">${l.newpl}</span><br><span class="t3">${l.newplHint}</span></span></a>
      ${soonRow('sArtist','user')}${soonRow('sGenre','note')}${soonRow('sTrack','list')}<hr>
      <div class="row" style="cursor:default;justify-content:space-between">${sp}${langPill()}</div><hr>
      <button type="button" class="row" data-act="clear">${ico('trash')}<span class="t2" style="font-family:var(--body);font-weight:600">${l.clear}</span></button>
      ${st.acct==='in'?`<button type="button" class="row danger" data-act="signout">${ico('out')}<span class="t2 danger" style="font-family:var(--body);font-weight:600">${l.signout}</span></button>`:''}`);
  }

  /* --- Transformar --- */
  function msNav(phone){
    const l = L(), cur = st.screen, inA = SIDE_A.includes(cur), [a,b] = SLOT[cur];
    const lit = (f)=>f>=a && f<b;
    const n = phone ? 64 : 104;
    const curBar = (f,k)=>{ const nOn = Math.round(b*n); return k >= Math.round(b*n)-4 && k < nOn };
    const stops = SCREENS.map(k => { const c = k===cur;
      return `<a href="#" class="stop${c?' cur':''}" data-go="${k}"${c?' aria-current="page"':''}><span class="lb">${l[k]}</span></a>` }).join('');
    return `<nav class="ms" aria-label="${l.mainNav}">${stops}<span class="flipmark${inA?'':' on'}" aria-hidden="true" title="${l.sideB}">⟲</span><span class="eqbar bars" aria-hidden="true">${bars(n,lit,curBar)}</span></nav>`;
  }
  function tAcctBtn(){
    const l = L(), open = st.open==='panel';
    const status = [st.sp?l.spOn:l.spOff, st.am?l.amOn:l.amOff].join(', ');
    const dots = `<span class="dots" aria-hidden="true">${st.sp?'<b class="sp"></b>':''}${st.am?'<b class="am"></b>':''}</span>`;
    const face = st.acct==='in' ? `<span class="avatar" aria-hidden="true">T</span>` : ico(P()?'user':'plug','ico',22);
    return `<button type="button" class="t-acct${st.acct==='in'?' in':''}" data-open="panel" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${st.acct==='in'||P()?l.acctAria:l.conOnly}${st.acct==='in'?' ('+l.name+')':''}: ${status}">${face}${dots}</button>`;
  }
  function tSub(){
    const l = L(), cur = st.screen;
    if (cur==='albums' && !P()) return `<div class="t-sub" role="navigation" aria-label="${l.albums}"><a href="#" class="cur" aria-current="page" data-go="albums">${l.byAlbum}</a><span aria-disabled="true">${l.otherTypes}</span></div>`;
    if (cur==='playlists'){ const s = st.sub||'saved'; const a=(k,t)=>`<a href="#" data-go="playlists" data-sub="${k}" class="${s===k?'cur':''}"${s===k?' aria-current="page"':''}>${t}</a>`; return `<div class="t-sub" role="navigation" aria-label="${l.playlists}">${a('saved',l.saved)}${a('new',l.newShort)}${a('series',l.plSeries)}</div>` }
    return '';
  }
  function transformarDesk(){
    const l = L(), open = st.open==='panel';
    const right = `${langPill()}${st.acct==='out'?`<button type="button" class="btn btn-ghost" data-act="signin">${l.signin}</button>`:''}<div style="position:relative">${tAcctBtn()}${open?`<div class="pop panel" role="dialog" aria-label="${l.acctAria}" style="right:0;top:54px">${panelBody(false)}</div>`:''}</div>`;
    return `<header class="t-top"><a class="home-link" href="#" data-act="home" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a><div class="mid">${msNav(false)}</div><div class="t-right">${right}</div></header>${tSub()}`;
  }
  function transformarPhone(){
    const l = L();
    return `<header class="t-top"><a class="home-link" href="#" data-act="home" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a><span class="e-name">${l[st.screen]}</span><div class="t-right">${tAcctBtn()}</div></header>${tSub()}<div class="t-bottom">${msNav(true)}</div>`;
  }
  function panelBody(phone){
    const l = L();
    const head = st.acct==='in' ? `<div class="hd"><span class="avatar" aria-hidden="true">T</span><div><div class="t1">${l.signedAs}</div><div class="t2">${l.name}</div></div></div>`
                                : (phone ? `<p class="hint">${l.hint}</p><button type="button" class="btn btn-primary full" data-act="signin">${l.signin}</button>` : '');
    const conn = (key, glyph, name, on) => `<div class="conn">${glyph}<div class="tx"><div class="t2">${name}</div><div class="t3${on?' ok':''}">${on?l.connected:l.notConn}</div></div>${on?`<button type="button" class="linkbtn" data-act="${key}" aria-label="${l.disconnect} ${name}">${l.disconnect}</button>`:`<button type="button" class="btn btn-ghost" data-act="${key}" aria-label="${l.connect} ${name}">${l.connect}</button>`}</div>`;
    return `${head}<div class="sec">${l.conns}</div>${conn('sp',spGlyph,'Spotify',st.sp)}${conn('am',amGlyph,'Apple Music',st.am)}${phone?`<div class="sec">${l.lang}</div><div style="padding:4px 6px">${langPill()}</div><hr><div class="row" aria-disabled="true" style="color:#a0a0a8">${ico('list')}${l.otherSeries}</div>`:''}<hr>
      <button type="button" class="row" data-act="clear">${ico('trash')}${l.clear}</button>
      ${st.acct==='in'?`<button type="button" class="row danger" data-act="signout">${ico('out')}${l.signout}</button>`:''}`;
  }
  function transformarSheet(){
    const l = L();
    return sheetWrap(l.account, `<div class="panel">${panelBody(true)}</div>`);
  }

  /* --- home (the approved v4 bar, as built), for the passage --- */
  function homeChrome(){
    const l = L(), stops = SCREENS.map(k => st.acct==='in' ? `<a href="#" class="stop" data-act="enter" data-to="${k}"><span class="lb">${l[k]}</span></a>` : `<a href="#" class="stop" data-act="story"><span class="lb">${l[k]}</span></a>`).join('');
    const nav = (phone) => `<nav class="ms" aria-label="${l.mainNav}">${stops}<span class="flipmark" aria-hidden="true">⟲</span><span class="eqbar bars" aria-hidden="true">${bars(phone?64:104,()=>false)}</span></nav>`;
    const cta = st.acct==='in' ? `<button type="button" class="btn btn-primary" data-act="enter">${l.start} <span class="eqi" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>`
                               : (P() ? `<button type="button" class="btn btn-ghost" data-act="signin-home">${l.signin}</button>` : `<button type="button" class="btn btn-ghost" data-act="signin-home">${l.signin}</button><button type="button" class="btn btn-primary" data-act="enter">${l.openapp}</button>`);
    if (P()) return `<header class="t-top"><a class="home-link" href="#" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a><div class="t-right">${langPill()}${cta}</div></header><div class="t-bottom">${nav(true)}</div>`;
    return `<header class="t-top"><a class="home-link" href="#" aria-label="${l.homeAria}"><img class="wm" src="${IMG.wordmark}" alt="The Album Blender"></a><div class="mid">${nav(false)}</div><div class="t-right">${langPill()}${cta}</div></header>`;
  }
  // where the home's own main button sits in the capture (CSS px of the screen under the bar)
  const HOT = { 'in-d':[16,465,146,48], 'out-d':[16,545,226,48], 'in-p':[16,199,361,48], 'out-p':[16,287,361,48] };

  function langPill(){ return `<span class="lang" role="group" aria-label="${L().lang}"><button type="button" data-lang="pt" lang="pt-BR" aria-pressed="${st.lang==='pt'}">PT</button><button type="button" data-lang="en" lang="en" aria-pressed="${st.lang==='en'}">EN</button></span>` }
  function sheetWrap(title, body){ return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab" aria-hidden="true"></div><div class="sh"><h2>${esc(title)}</h2><button type="button" class="closebtn" data-act="close" aria-label="${L().close}">${ico('x')}</button></div>${body}</div>` }

  function render(){
    const phone = P(), l = L();
    vp.className = `vp lv-${st.level}${st.motion && !RM ? ' moving':' reduce'}${st.arriving?' arrive':''}${phone?' p':''}`;
    vp.setAttribute('lang', st.lang==='pt'?'pt-BR':'en');
    let html = `<a class="skip" href="#" data-act="skip">${l.skip}</a>`;
    if (st.level === 'ref'){
      const key = `ref-${st.acct}-${st.open==='sheet'&&phone?'menu':st.screen}-${phone?'p':'d'}`;
      const src = IMG[key] || IMG[`ref-out-${st.screen}-${phone?'p':'d'}`];
      html += `<img class="refimg" src="${src}" alt="Captura do app hoje: ${l[st.screen]}">`;
      html += `<span class="refnote">Hoje · captura de 21/11${IMG[key]?'':' (sem conta)'} · em inglês</span>`;
      vp.innerHTML = html; return;
    }
    const top = phone ? 56 : 72, sub = (st.level==='transformar' && st.mode==='app' && ((st.screen==='albums'&&!phone)||st.screen==='playlists')) ? 44 : 0;
    const bottom = phone ? 68 : 0;
    const screenImg = st.mode==='home' ? IMG[`home-${st.acct}-${phone?'p':'d'}`] : img(st.screen);
    html += `<main class="scr" id="${id}-main" tabindex="-1" style="top:${top+sub}px;bottom:${bottom}px"><img src="${screenImg}" alt="${st.mode==='home'?'A home (v4 aprovada)':'Tela '+l[st.screen]+' do app, capturada em 21/11'}"></main>`;
    if (st.mode==='home'){
      html += homeChrome();
      const h = HOT[`${st.acct}-${phone?'p':'d'}`];
      html += `<button type="button" class="hot" data-act="enter" aria-label="${st.acct==='in'?l.start:l.openapp} (na home)" style="left:${h[0]}px;top:${h[1]+top}px;width:${h[2]}px;height:${h[3]}px"></button>`;
    } else if (st.level==='elevar'){
      html += phone ? elevarPhone() : elevarDesk();
      if (phone && st.open==='sheet') html += elevarSheet();
    } else {
      html += phone ? transformarPhone() : transformarDesk();
      if (phone && st.open==='panel') html += transformarSheet();
    }
    vp.innerHTML = html;
    if (st.kbd){ const el = vp.querySelector(st.kbd); if (el) el.classList.add('kbd-demo') }
    if (st.arriving) setTimeout(()=>{ st.arriving=false; vp.classList.remove('arrive') }, 1400);
    clearTimeout(idleT); idleT = setTimeout(()=>vp.classList.remove('moving'), 10000);
  }

  function refocus(sel){ const el = vp.querySelector(sel); if (el) el.focus({preventScroll:true}) }
  vp.addEventListener('click', e => {
    if (!st.interactive) { e.preventDefault(); return }
    const t = e.target.closest('[data-go],[data-act],[data-open],[data-lang]'); if (!t) { if (st.open && !e.target.closest('.pop')) { st.open=null; render() } return }
    e.preventDefault();
    if (t.dataset.lang){ st.lang = t.dataset.lang; render(); vp.querySelector(`[data-lang="${st.lang}"]`)?.focus({preventScroll:true}); return }
    if (t.dataset.open){ const o = t.dataset.open; lastTrigger = o; st.open = st.open===o ? null : o; render(); const f = vp.querySelector('.sheet .closebtn, .pop a:not([aria-disabled]), .pop button'); if (st.open && f) f.focus({preventScroll:true}); else vp.querySelector(`[data-open="${o}"]`)?.focus({preventScroll:true}); return }
    if (t.dataset.go){ if (t.getAttribute('aria-disabled')==='true') return; st.screen = t.dataset.go; st.sub = t.dataset.sub || (st.screen==='playlists'?'saved':null); st.open = null; render(); vp.querySelector(`[data-go="${st.screen}"][aria-current]`)?.focus({preventScroll:true}); if (t.dataset.sub==='series') toast(L().plSeries+': a tela não foi capturada nesta rodada'); if (t.dataset.sub==='new') toast(L().newpl+': a tela não foi capturada nesta rodada'); return }
    const a = t.dataset.act;
    if (a==='close'){ st.open=null; render(); vp.querySelector(`[data-open="${lastTrigger}"]`)?.focus({preventScroll:true}); return }
    if (a==='sp'){ st.sp=!st.sp; render(); toast(st.sp?L().spOn:L().spOff); refocus('[data-act="sp"]'); return }
    if (a==='am'){ st.am=!st.am; render(); toast(st.am?L().amOn:L().amOff); refocus('[data-act="am"]'); return }
    if (a==='signin'){ st.acct='in'; st.open=null; render(); toast('Simulado: no app abre a janela de entrar'); refocus('[data-open]'); return }
    if (a==='story'){ toast(L().homeStory); return }
    if (a==='signin-home'){ toast('Na home: leva a /start?signin'); return }
    if (a==='signout'){ st.acct='out'; st.open=null; render(); toast('Simulado: saiu da conta'); refocus('[data-act="signin"],[data-open]'); return }
    if (a==='clear'){ toast('Pede confirmação antes de limpar (como hoje)'); refocus('[data-act="clear"]'); return }
    if (a==='skip'){ vp.querySelector('main')?.focus({preventScroll:true}); return }
    if (a==='home'){ if (host.dataset.passage){ st.mode='home'; st.screen='start'; st.open=null; render(); host.dispatchEvent(new CustomEvent('mode')) } else toast('O logotipo leva à home (/home)'); return }
    if (a==='enter'){ st.mode='app'; st.screen=t.dataset.to||'start'; st.arriving=!(RM||!st.motion); render(); vp.querySelector('main')?.focus({preventScroll:true}); host.dispatchEvent(new CustomEvent('mode')); return }
  });
  vp.addEventListener('keydown', e => {
    if (e.key==='Escape' && st.open){ st.open=null; render(); vp.querySelector(`[data-open="${lastTrigger}"]`)?.focus({preventScroll:true}); }
    if (e.key==='Tab'){ const sh = vp.querySelector('.sheet'); if (sh){ const f=[...sh.querySelectorAll('a[href],button')]; if(!f.length) return; if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus({preventScroll:true}) } else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus({preventScroll:true}) } } }
    if ((e.key===' '||e.key==='Enter') && e.target.matches('a[data-go],a[data-act]')){ e.preventDefault(); e.target.click() }
  });
  render(); fit();
  return { st, set(o){ Object.assign(st,o); render(); fit() } };
}

function viewStates(force){

    <p class="sub">${force?LEVELS[lv].say:'Um nível por vez. Mexa nas chaves; o menu também funciona com o teclado (Tab, Enter, Esc).'}</p>
    <div class="ctl">${force?'':`<span class="seg" role="group" aria-label="Nível">${['elevar','transformar','ref'].map(k=>`<button type="button" data-lv="${k}" aria-pressed="${lv===k}">${LEVELS[k].name}</button>`).join('')}</span>`}${segW()}</div>
    <div class="ctl"><span class="lab">Explorar</span>${chips('acct',[['out','Sem conta'],['in','Com conta']])}${chips('lang',[['pt','PT'],['en','EN']])}${chips('sp',[['false','Spotify: não'],['true','Spotify: sim']])}${lv==='elevar'?'':chips('am',[['false','Apple: não'],['true','Apple: sim']])}${chips('motion',[['true','Movimento'],['false','Reduzido']])}</div>
    ${lv==='elevar'?'<p class="small">No Elevar a Apple Music fica como hoje: pedida só na hora de exportar.</p>':''}
    <div id="big" style="max-width:${UI.w===393?'420px':'100%'}"></div>
    <h2 style="font:800 22px/1.2 var(--display);margin:30px 0 0">Os estados, um a um</h2>
    <div class="grid-states${UI.w===1280?' desk':''}">${PRESETS.map((p,i)=>`<div class="st"><h3>${p[0]}</h3><div class="mini" data-i="${i}"></div></div>`).join('')}</div>`;
  Device($('#big'), Object.assign({ level:lv, w:UI.w }, X, { sp:X.sp===true||X.sp==='true', am:X.am===true||X.am==='true', motion:X.motion!==false&&X.motion!=='false' }));
  document.querySelectorAll('.mini').forEach(h => { const p = Object.assign({}, PRESETS[h.dataset.i][1]); if (p.open==='MENU') p.open = lv==='elevar' ? (UI.w===393?'sheet':(p.acct==='in'?'acct':'albums-dd')) : (lv==='ref' ? 'sheet' : 'panel'); Device(h, Object.assign({ level:lv, w:UI.w }, p)) });
  bindW($('#app'), () => viewStates(force));
  document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { UI.lv = b.dataset.lv; viewStates() });
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { UI.x = Object.assign({}, X, { [b.dataset.x]: b.dataset.v }); viewStates(force) });
}

function viewNotes(){
  $('#app').innerHTML = `<a class="back" href="#">← Voltar à pergunta</a><div class="notes"><h1 class="view">Notas da rodada 1</h1>
<p class="sub">O detalhe está em <code>design/proposals/f88-top-menu/proposal.md</code>. Aqui, o essencial.</p>

<h2>O que o menu faz hoje, e onde fica em cada nível</h2>
<table>
<thead><tr><th>Hoje (computador · celular)</th><th>Elevar</th><th>Transformar</th></tr></thead>
<tbody>
<tr><td>Logotipo leva à home</td><td>a marca da home, leva à home</td><td>a marca da home, leva à home</td></tr>
<tr><td>Start · Albums · Blend · Playlists · Inventory</td><td>os cinco, com o atual aceso no fogo</td><td>os cinco na barra da home; o fogo mostra onde você está</td></tr>
<tr><td>«Music Series»: por álbum; artista, gênero, faixa (em breve); séries de playlists</td><td>«Álbuns ▾» com a mesma lista</td><td>uma linha embaixo da barra em Álbuns (computador) e em Playlists; no celular, os «em breve» ficam no painel da conta</td></tr>
<tr><td>Novas playlists (celular, no menu)</td><td>no menu do celular, como hoje</td><td>na linha de Playlists: Salvas · Novas · Séries</td></tr>
<tr><td>Spotify: conectar, desconectar</td><td>a pílula verde, no estilo da home</td><td>em «Conexões», no botão da conta</td></tr>
<tr><td>Apple Music (hoje só na hora de exportar)</td><td>igual a hoje</td><td>em «Conexões», ao lado do Spotify (novo)</td></tr>
<tr><td>Entrar · sair · «Entrou como»</td><td>como hoje, no estilo da home</td><td>no botão da conta; «Entrar» também na barra</td></tr>
<tr><td>Limpar o cache dos álbuns (rodapé no computador; menu no celular)</td><td>igual a hoje</td><td>no botão da conta, nos dois tamanhos</td></tr>
<tr><td>Nome da tela na barra do celular</td><td>mantido</td><td>mantido (o idioma vai para o painel da conta no celular)</td></tr>
<tr><td>Idioma (não existe no app)</td><td colspan="2">PT · EN na barra no computador, como na home; no celular, no menu (a escolha em si é da F81)</td></tr>
</tbody></table>
<p class="small">Nada do que o menu faz hoje se perde nos dois níveis.</p>

<h2>Minha recomendação</h2>
<p><strong>Transformar.</strong> A barra da home é a mesma no app: quem clica em «Inicie» não troca de site, só vê o fogo acender no lugar onde chegou. A barra já existe construída na home e é reaproveitada no código de hoje; o React vem depois, sem mudar o desenho. O risco: a barra de baixo do celular perde os ícones; os rótulos de 12 px e o fogo carregam o lugar.</p>

<h2>Perguntas para você</h2>
<ol>
<li><strong>Qual caminho?</strong> Elevar ou Transformar. Recomendo o Transformar, pela passagem sem corte.</li>
<li><strong>Apple Music no menu?</strong> (a) em «Conexões», ao lado do Spotify; (b) como hoje, só na hora de exportar. Recomendo (a): a home já promete «Spotify ✓ · Apple Music ✓».</li>
<li><strong>No celular, a barra de baixo com ou sem ícones?</strong> (a) só rótulos e barras, como na home; (b) ícones pequenos sobre os rótulos. Recomendo (a), para ser a mesma barra; se no iPhone ficar difícil achar, voltamos aos ícones.</li>
</ol>

<h2>O que não pude conferir</h2>
<ul>
<li>O iPhone de verdade (Safari, toque, área segura): só a 393 × 852 no Chrome.</li>
<li>Telas com conta de verdade: a conta é de teste, as telas vêm das capturas de 21/11.</li>
<li>«Novas playlists» e «Séries de playlists» não têm captura: o protótipo avisa ao tocar.</li>
<li>Os textos em inglês são proposta; os finais vêm da F81.</li>
</ul>
</div>`;
}

addEventListener('hashchange', route); route();
