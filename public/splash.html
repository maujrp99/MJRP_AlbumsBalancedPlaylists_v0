<style>
:root{
  --bg:#0a0a0c;--panel:#121216;--line:rgba(255,255,255,.12);
  --orange:#f97316;--orange-text:#fb923c;--red:#dc2626;--amber:#fbbf24;
  --text:#fff;--muted:#b9b9c2;--faint:#9a9aa4;
  --flame:linear-gradient(135deg,#f97316 0%,#dc2626 100%);
  --display:'Syne',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left));
  --top:64px;--thread:48px;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark;scroll-padding-top:calc(var(--top) + var(--thread) + 8px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:#fff;color:#000;padding:10px 14px;z-index:30;border-radius:8px}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header.top .wrap{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--top)}
.home{display:inline-flex;align-items:center;min-height:44px}
.logo{display:block;height:30px;width:auto}
.top nav{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;min-width:44px;padding:0 22px;border-radius:12px;font:800 18px/1 var(--display);text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--flame);color:#0b0b0b;box-shadow:0 0 24px rgba(249,115,22,.32)}
.btn-primary:hover{box-shadow:0 0 34px rgba(249,115,22,.5)}
.btn-ghost{border:1px solid rgba(255,255,255,.62);color:#fff;font-weight:700}
.btn-ghost:hover{border-color:#fff}
.btn-sm{min-height:44px;padding:0 16px;font-size:16px}
/* the equalizer breathes on the main action, nowhere else but the thread */
.eqi{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.eqi i{width:3px;border-radius:1px;background:#0b0b0b;height:var(--h);transform-origin:bottom}
.eqi i:nth-child(1){--h:55%;--d:.71s}.eqi i:nth-child(2){--h:100%;--d:.93s;--o:-.3s}.eqi i:nth-child(3){--h:70%;--d:.62s;--o:-.5s}.eqi i:nth-child(4){--h:40%;--d:1.08s;--o:-.2s}
html.moving:not(.paused) .eqi i{animation:eqb var(--d) ease-in-out var(--o,0s) infinite alternate}

/* the thread: the record's progress, one group of bars per track; the only navigation motif */

/* story: text column + the stage */
.story{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);column-gap:clamp(24px,4vw,64px);align-items:start}
.story > section{grid-column:1;min-height:calc(88dvh - var(--top) - var(--thread));display:flex;flex-direction:column;justify-content:center;padding:56px 0}
.story > .stage-col{grid-column:2;grid-row:1 / span 8;align-self:stretch}
.hero{min-height:calc(100dvh - var(--top) - var(--thread) - 36px)!important;padding-top:24px!important}
.kicker{font:700 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--orange-text);margin:0 0 16px}
h1{font:800 clamp(38px,3.6vw,48px)/1.04 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.what{font-size:19px;color:var(--muted);max-width:38ch;margin:22px 0 30px}
.what strong{color:#fff;font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h2.t,h3.t{font:800 clamp(30px,3.3vw,44px)/1.05 var(--display);letter-spacing:-.015em;margin:0 0 16px;text-wrap:balance}
section p{color:var(--muted);margin:0 0 14px;max-width:44ch}
.ranked{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);margin-top:12px;max-width:440px}
.ranked .tag{font:700 12px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#d6d6dc;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.ranked .tag b{color:var(--orange-text)}
.ranked ol{list-style:none;margin:0;padding:0}
.ranked li{display:grid;grid-template-columns:20px 1fr 84px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.07);font-size:15px}
.ranked .note{font-size:13px;color:var(--faint);margin:8px 0 0}

/* the stage: ember glow (back), crate (middle); text never sits on it */
.stage{position:sticky;top:calc(var(--top) + var(--thread));height:calc(100dvh - var(--top) - var(--thread) - 8px);min-height:520px;margin:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1;min-height:0;isolation:isolate;overflow:hidden}
.glow{position:absolute;inset:auto -10% -6% -10%;height:55%;z-index:0;background:radial-gradient(50% 70% at 50% 100%,rgba(249,115,22,calc(.42 * var(--fire,1))),rgba(220,38,38,calc(.18 * var(--fire,1))) 45%,transparent 75%);transition:opacity .6s}
.embers{position:absolute;left:0;right:0;bottom:0;height:42%;width:100%;z-index:1;pointer-events:none}
.gl{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:0;transition:opacity .8s ease}
.stage.live .gl{opacity:1}
.stage.live .crate-css{opacity:0;visibility:hidden}
/* CSS crate: before the script, without WebGL, with reduced motion, and on the phone */
.crate-css{position:absolute;inset:0;z-index:2;perspective:1100px;perspective-origin:50% -10%;transition:opacity .6s;opacity:0}
html.js .crate-css{opacity:1}
.crate-css .box{position:absolute;left:50%;bottom:16%;width:min(56%,330px);aspect-ratio:1;transform:translateX(-50%) rotateY(var(--yaw,0deg));transform-style:preserve-3d}
.crate-css .sl{position:absolute;inset:0;width:100%;height:100%;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08) inset;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .4s;opacity:0}
.crate-css .sl.vis{opacity:1}
/* without script the crate shows side A as a fan (the noscript style in the head); with script it appears once the script has placed it, so the covers do not move after the first paint */
.crate-css .front{position:absolute;left:50%;bottom:9%;width:min(64%,378px);height:24%;transform:translateX(-50%) rotateY(var(--yaw,0deg));z-index:40;border-radius:4px;background:linear-gradient(180deg,#3a2616,#24170d 60%,#1a0f08);box-shadow:0 -1px 0 rgba(255,200,150,.18) inset,0 20px 40px rgba(0,0,0,.6)}
.crate-css .front::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 31%,rgba(0,0,0,.35) 31% 33%);border-radius:4px}
.caption{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:8px 0 12px;border-top:1px solid var(--line)}
.caption .who{min-width:0;font-size:14px;color:var(--muted);line-height:1.35}
.caption .src{display:block;font-size:12px;color:var(--faint)}
.caption .who b{display:block;font:700 17px/1.2 var(--display);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.62);font:600 14px/1 var(--body);text-decoration:none;white-space:nowrap;color:#fff}
.am:hover{border-color:#fff}
.am .mk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:linear-gradient(180deg,#fa5c6f,#f9354f);color:#fff;font:800 12px/1 var(--body)}
.credit-tag{position:absolute;top:10px;left:0;z-index:5;font:600 12px/1.3 var(--body);color:#e6e6ea;background:rgba(10,10,12,.72);padding:6px 9px;border-radius:6px;letter-spacing:.02em}

/* side B: the CTA */
.final .ctas{margin-top:8px}
footer{border-top:1px solid var(--line);padding:32px 0 calc(40px + env(safe-area-inset-bottom));color:var(--faint);font-size:14px}
footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
footer nav{display:flex;gap:4px;flex-wrap:wrap}
footer nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;text-decoration:none;color:#d6d6dc}
footer p{margin:12px 0 0;max-width:80ch}
footer p a{color:#d6d6dc;display:inline-block;padding:12px 0;margin:-12px 0}
.b2-fire{display:none}

/* PHONE: one column; the crate is a short CSS fan under the hero; the thread and the main action live in the bottom bar (the phone's own page: the last block, F96) */
@media (max-width:899px){
  :root{--top:56px;--thread:0px}
  body{font-size:16px;padding-bottom:calc(var(--pbar-h) + env(safe-area-inset-bottom))}
  .logo{height:22px}
  .top .btn-primary{display:none}
  .story{display:flex;flex-direction:column}
  .story > *{order:2}.story > .hero{order:0}.story > .stage-col{order:1}
  .story > section{min-height:0;padding:44px 0;border-top:1px solid var(--line)}
  .story > section.hero{border-top:0;min-height:0!important;padding:20px 0 8px!important}
  h1{font-size:36px}
  .what{font-size:17px;margin:16px 0 22px}
  .ctas .btn{flex:1 1 100%}
  .stage{position:relative;top:0;height:auto;min-height:0}
  .scene{height:330px;flex:none}
  .stage-col{margin:0 calc(-1 * var(--gutter))}
  .caption{padding:8px var(--gutter) 12px}
  .credit-tag{left:var(--gutter)}
  .caption .who b{white-space:normal}
  .b2-fire{display:block;position:relative;height:120px;margin:8px calc(-1 * var(--gutter)) -44px;overflow:hidden}
  .b2-fire .glow{bottom:-20%;height:120%}
  .b2-fire canvas{position:absolute;inset:0;width:100%;height:100%}
  .crate-css .box{width:min(58%,220px);bottom:18%}
  .crate-css .front{width:min(68%,260px)}
}
@media (prefers-reduced-motion:reduce){
  .crate-css .sl,.gl,.crate-css{transition:none!important}
}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
/* ===== F80 · home menu preview (UAT-241, UAT-240): shared ===== */
html:not(.in) .only-in{display:none!important}
html.in .only-out{display:none!important}
.door{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--orange-text);font:700 16px/1 var(--body);text-decoration:none;margin-top:6px}
.door:hover{text-decoration:underline}
.top .wrap{gap:20px}
.top .acct{display:flex;gap:8px;align-items:center;flex:0 0 auto}
/* the slider-menu: five stops on ONE continuous row of bars (Elevar's thread), the fire fills it as you read */
.needle{display:none}
/* the pause: a discreet icon in the stage's corner, where the motion is */
.motion-icon{position:absolute;z-index:6;top:8px;right:8px;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.28);background:rgba(10,10,12,.6);color:#d6d6dc;cursor:pointer;padding:0}
.motion-icon:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.motion-icon svg{fill:currentColor}
.motion-icon .i-play{display:none}
html.paused .motion-icon .i-play{display:block}
html.paused .motion-icon .i-pause{display:none}
@media (max-width:899px){
  .motion-icon{width:44px;height:44px;border-radius:22px;top:6px;right:var(--gutter)}
  html.in .top .btn-start{display:inline-flex}
  .top .acct .btn-primary.only-out{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

:root{--top:72px;--thread:0px}
.thread{display:none}
.ms-desk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:var(--bar-w);min-width:0}
/* the header, signed out, has only «Entrar»: the main button stays in the middle of the page (the owner's choice «A», F88) */
.top .acct .btn-primary.only-out{display:none}
@media (max-width:899px){
  :root{--top:56px}
  .ms-desk{display:none}
  .thread{display:block}
}
/* ===== v2: Portuguese first, the real ranking card, the flip as a band ===== */
.rank-real .tag{flex-direction:column;gap:4px}
.rank-real li{grid-template-columns:20px 1fr auto}
.rank-real li.up .tt{color:#fff;font-weight:600}
.rank-real .mv{font:700 12px/1.2 var(--body);color:var(--orange-text);white-space:nowrap}
.rank-real .more-tracks{font-size:14px;color:var(--muted);margin:8px 0 0}
/* the flip: a short band, not a screen; the crate still turns while it passes */
.story > section.flip-band{min-height:0;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0}
.flip-band .fb-title{font:800 22px/1.2 var(--display);margin:0 0 6px;color:var(--orange-text);letter-spacing:-.01em}
.flip-band .fb-line{margin:0;color:var(--muted)}
/* Portuguese runs longer: the menu's labels stay on one line */
@media (max-width:899px){
  .story > section.flip-band{padding:8px 0;margin:0;border-bottom:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .flip-band .fb-title{font-size:14px;margin:0}
  .flip-band .fb-line{font-size:13px;line-height:1.35}
}
/* ===== F80 · the home as built: the hero's lines, the language switch, the menu without script ===== */
.top .acct{gap:10px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:22px;overflow:hidden;flex:0 0 auto}
.lang button{min-width:44px;min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--muted);font:700 13px/1 var(--body);letter-spacing:.06em;cursor:pointer}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.14)}
@media (max-width:899px){
  .lang button{min-width:44px;padding:0 6px}
  .top .acct{gap:6px}
  html:not(.js) .ms-desk{display:block;position:static;width:100%}
  html:not(.js) .thread{display:none}
}



/* ===== v4 (2026-11-21): the rhythm. Every story = text + a vignette that means it; no dead stretch ===== */
.hero .h-sub{font:700 clamp(22px,2.1vw,27px)/1.18 var(--display);letter-spacing:-.01em;color:var(--orange-text);margin:14px 0 0;max-width:24ch;text-wrap:balance}
.hero .what{margin-top:18px}
/* the computer: shorter stories, centred; the vignette under the text, the crate on the right as before */
.v4-lead{display:block}
.v4-motif{position:relative;display:block;width:min(100%,420px);height:200px;margin:28px 0 0;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;contain:layout paint;
  background:radial-gradient(110% 80% at 50% 125%,rgba(249,115,22,.13),rgba(220,38,38,.04) 55%,transparent 75%),#0f0f13}
.v4-motif *{box-sizing:border-box}
.v4-disc{position:relative;display:block;flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,#0f0f13 0 7%,var(--lab,#f97316) 8% 30%,#141418 31% 34%,transparent 35%),repeating-radial-gradient(circle,#1c1c22 0 1.4px,#26262d 1.4px 2.8px);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.v4-disc::after{content:"";position:absolute;left:50%;top:30%;width:2px;height:2px;margin-left:-1px;border-radius:50%;background:rgba(255,255,255,.55)}
/* Inicie */
.m-start{padding:18px}
.s-field{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#15151a}
.s-lens{flex:0 0 auto;fill:none;stroke:#9a9aa4;stroke-width:1.6;stroke-linecap:round}
.s-q{position:relative;display:block;overflow:hidden;font:600 15px/1 var(--body);color:#e9e9ee;white-space:nowrap;padding:3px 2px 3px 0}
.s-mask{position:absolute;inset:0;background:#15151a;transform:translateX(101%)}
.s-mask::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:2px;border-radius:1px;background:var(--orange-text)}
.s-rows{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.s-rows li{display:flex;align-items:center;gap:12px}
.s-rows b{display:block;height:7px;width:46%;border-radius:4px;background:rgba(255,255,255,.36)}
.s-rows s{display:block;height:6px;width:18%;border-radius:3px;background:rgba(255,255,255,.2)}
.s-rows .r1 b{background:linear-gradient(90deg,rgba(249,115,22,.75),rgba(220,38,38,.45))}
.v4-disc.hot{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 14px rgba(249,115,22,.45)}
/* Álbuns (the card is the story's illustration, on every width) */
.rank-real li{height:38px;padding:0}
.rank-real .tt,.rank-real .mv{transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .5s ease .55s}
html.v4-armed .rank-real:not(.go) li.up .tt,html.v4-armed .rank-real:not(.go) li.up .mv{transform:translateY(38px)}
html.v4-armed .rank-real:not(.go) li:nth-child(2) .tt{transform:translateY(-38px)}
html.v4-armed .rank-real:not(.go) li.up .mv{opacity:0}
/* Blend */
.m-blend{display:grid;grid-template-columns:28px minmax(0,1fr) 44%;grid-template-rows:minmax(0,1fr);column-gap:0;padding:16px 18px;height:200px}
.m-blend > *{min-height:0;height:100%}
.b-src{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.b-src .v4-disc{width:28px;height:28px}
.v4-disc.c1{--lab:#f97316}.v4-disc.c2{--lab:#dc2626}.v4-disc.c3{--lab:#fbbf24}
.b-lines{width:100%;height:100%;overflow:visible}
.b-lines .ln{fill:none;stroke:rgba(255,255,255,.11);stroke-width:1.2;vector-effect:non-scaling-stroke}
.b-list{list-style:none;margin:0;padding:0;display:grid;grid-template-rows:repeat(6,1fr);align-items:center}
.b-list li{display:flex;align-items:center;gap:8px}
.b-list li i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--lab)}
.b-list li b{display:block;height:6px;flex:1;max-width:120px;border-radius:3px;background:rgba(255,255,255,.36)}
.b-list .c1{--lab:#f97316}.b-list .c2{--lab:#dc2626}.b-list .c3{--lab:#fbbf24}
.m-blend.live .b-list li{animation:v4row 7.2s ease-in-out infinite both}

/* Playlists */
.m-pl{padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between}

.mos i{display:block;background:var(--c)}
.p1 .mos i:nth-child(1){--c:#4a2a1a}.p1 .mos i:nth-child(2){--c:#2a2238}.p1 .mos i:nth-child(3){--c:#5a4a1f}.p1 .mos i:nth-child(4){--c:#1f3b3a}
.p2 .mos i:nth-child(1){--c:#3a1f24}.p2 .mos i:nth-child(2){--c:#26323d}.p2 .mos i:nth-child(3){--c:#40301c}.p2 .mos i:nth-child(4){--c:#2b2b30}
.p-list b{display:block;height:7px;width:70%;border-radius:4px;background:rgba(255,255,255,.22)}
.p-list s{display:block;grid-column:2;height:6px;width:38%;border-radius:3px;background:rgba(255,255,255,.1)}
.p-play{grid-column:3;grid-row:1 / span 2;font-size:11px;line-height:1;color:var(--orange-text)}
.p-out{display:flex;gap:14px;flex-wrap:wrap;padding:0 2px}
.ex{display:inline-flex;align-items:center;gap:5px;font:600 12px/1.2 var(--body);color:#b9b9c2;white-space:nowrap}
.ex i{font-style:normal;color:var(--orange-text)}
.m-pl.live .p-play{animation:v4pulse 1.6s ease-in-out infinite}
.m-pl.live .ex i{animation:v4chip 6s ease-in-out infinite both}
.m-pl.live .ex-am i{animation-delay:-3s}
/* Inventário */
.m-inv{padding:0 18px}
.i-row{position:absolute;left:22px;right:18px;bottom:30px;display:flex;align-items:flex-end;gap:16px}
.i-vinyl{position:relative;display:block;width:104px;height:104px;margin-right:42px}
.i-sleeve{position:absolute;inset:0;border-radius:3px;background:linear-gradient(160deg,#2b1a10,#160e09);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.6)}
.i-sleeve::after{content:"";position:absolute;left:12%;right:12%;top:44%;height:12%;border-radius:2px;background:linear-gradient(90deg,#dc2626,#f97316 60%,#fbbf24);opacity:.75}
.i-disc{position:absolute;top:3%;left:3%;width:94%;height:94%;border-radius:50%;transform:translateX(40%);
  background:radial-gradient(circle,#0f0f13 0 3%,#f97316 4% 26%,#151519 27% 29%,transparent 30%),repeating-radial-gradient(circle,#17171c 0 1.6px,#222228 1.6px 3.2px);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.i-disc::after{content:"";position:absolute;left:50%;top:30%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:rgba(255,255,255,.55)}
.i-stack{display:flex;align-items:flex-end;gap:16px}
.i-cd{position:relative;display:block;width:72px;height:64px;border-radius:3px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.i-cd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-right:1px solid rgba(255,255,255,.14)}
.i-cdd{position:absolute;left:16px;top:6px;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle,#0f0f13 0 12%,rgba(255,255,255,.18) 13% 16%,transparent 17%),conic-gradient(from 30deg,#3a3a44,#5a5a66,#3a3a44,#4b4038,#3a3a44)}
.i-tape{position:relative;display:block;width:92px;height:58px;border-radius:5px;background:#1d1d23;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.i-tape::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:10px;border-radius:2px;background:linear-gradient(90deg,#dc2626,#f97316 60%,#fbbf24);opacity:.7}
.i-tape::after{content:"";position:absolute;left:22px;right:22px;top:24px;height:22px;border-radius:11px;background:#0d0d10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.i-reel{position:absolute;z-index:1;top:27px;width:16px;height:16px;border-radius:50%;border:2px dashed rgba(255,255,255,.45)}
.i-reel:first-child{left:27px}.i-reel:last-child{right:27px}
.i-plank{position:absolute;left:0;right:0;bottom:16px;height:14px;background:linear-gradient(180deg,#3a2616,#24170d 70%,#1a0f08);box-shadow:0 -1px 0 rgba(255,200,150,.16) inset}
.m-inv.live .i-disc{animation:v4slide 8s cubic-bezier(.3,.6,.2,1) infinite both}
.m-inv.live .i-reel{animation:v4spin 2.6s linear infinite}
/* the loops */
@keyframes v4eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes v4spin{to{transform:rotate(360deg)}}
@keyframes v4rise{0%,100%{transform:translateY(6px);opacity:.55}50%{transform:translateY(-4px);opacity:1}}
@keyframes v4type{0%,8%{transform:translateX(0)}38%,100%{transform:translateX(101%)}}
@keyframes v4blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes v4row{0%{opacity:.5}8%,82%{opacity:1}100%{opacity:.5}}
@keyframes v4chip{0%,8%{opacity:.35}20%,42%{opacity:1}54%,100%{opacity:.35}}
@keyframes v4pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes v4slide{0%{transform:translateX(4%) rotate(0)}22%,78%{transform:translateX(40%) rotate(220deg)}100%{transform:translateX(4%) rotate(360deg)}}
@keyframes v4fade{0%,92%{opacity:1}100%{opacity:0}}
@keyframes v4r1{0%,40%{opacity:.55}47%,90%{opacity:1}100%{opacity:.55}}
@keyframes v4r2{0%,46%{opacity:.55}53%,90%{opacity:1}100%{opacity:.55}}
@keyframes v4r3{0%,52%{opacity:.55}59%,90%{opacity:1}100%{opacity:.55}}
.m-start.live .s-mask{animation:v4type 7s steps(11,end) infinite both}
.m-start.live .s-mask::before{animation:v4blink .9s step-end infinite}
.m-start.live .s-q{animation:v4fade 7s linear infinite both}
.m-start.live .r1{animation:v4r1 7s ease-out infinite both}
.m-start.live .r2{animation:v4r2 7s ease-out infinite both}
.m-start.live .r3{animation:v4r3 7s ease-out infinite both}
/* motion: the loops freeze when the page rests (10 s after the last scroll); the pause shows the stills */
html.paused .rank-real .tt,html.paused .rank-real .mv{transition:none}
html:not(.moving) .v4-motif *,html:not(.moving) .v4-motif *::before{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.v4-motif,.v4-motif *,.v4-motif *::before{animation:none!important;transition:none!important}.rank-real .tt,.rank-real .mv{transition:none!important}}

/* the phone's opening (the stories' own phone style is the last block, F96) */
@media (max-width:899px){
  .hero .h-sub{font-size:20px;margin-top:10px}

  .hero .h-sub{margin-bottom:18px}

}
/* the CSS crate's diagonal on a computer is in the style, not set by the script after load: the covers do not move when it arrives (splash.js sets the same -15deg, half the camera's 30deg azimuth) */
@media (min-width:900px){.crate-css{--yaw:-15deg}}

/* ===== the stories' height (v4, hand-over table): computer clamp(540px,70dvh,680px), the invitation clamp(440px,56dvh,560px); phone: the content =====
   Change them here with --story-min (computer) and --story-min-phone; per story with #id{--story-min:...}.
   The vignette of each story is its .v4-motif (decorative, aria-hidden, data-ambient="id"), in .v4-lead; ambient.js fades it with the scroll. */
.story > section{position:relative;isolation:isolate;min-height:var(--story-min,clamp(540px,70dvh,680px));padding:48px 0}
.story > section.final{min-height:var(--story-min,clamp(440px,56dvh,560px))}
@media (max-width:899px){
  .story > section{min-height:var(--story-min-phone,0);padding:36px 0}
  .story > section.final{min-height:var(--story-min-phone,0)}
  .story > section.hero{min-height:0}
}
/* ===== F96 (2026-11-23) · the phone's entry page, the owner's choice («escolho a do especialista, mas com essa landing aqui»): the crate on the
   diagonal and no big button; the part that teaches the app under its own title, each step label, title, text and then ONE illustration (the
   measure the computer gives it); the albums in one row at the end, the page's only sideways swipe. The computer keeps its page: what is new
   there is read, not shown.
   THE STEP MARK is ONE switch, `data-step-mark` on <main>: "line" (today: the label and a thin line from edge to edge above each step) or
   "bands" (the even steps on the design system's «painel», #101014: a role to be approved in design-system.md before it is used).
   THE ORANGE: in this stretch only the part's title is orange (the design system's `--orange`); labels, the flip and the doors are neutral. ===== */
.edu-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.story > .shelf-sec{display:none} /* as specific as the page's own rule for a story (.story > section), which would show it */
@media (max-width:899px){
  /* the top bar never makes the page wider than the screen: the mark gives way (it shrinks), the account side keeps its size */
  .top .wrap{gap:10px}
  .top .home{flex:0 1 133px;min-width:0}
  .top .logo{width:100%;height:auto}
  .top .btn-sm{padding:0 12px;gap:8px}
  /* the landing: no big button (the visitor's way in is the bottom bar's «Criar»; without script the noscript style keeps the button);
     the light CSS crate turned to the diagonal, in the style, so the covers do not move when the script arrives (never the 3D library) */
  .hero .ctas{display:none}
  .crate-css{--yaw:-30deg}
  .crate-css .box,.crate-css .front{left:43%} /* turned, the row of covers runs to the right: the crate steps left so it stays in the scene, clear of the pause icon */
  /* the part that teaches the app (the page's column keeps the computer grid's `align-items:start`: what must be as wide as the screen says `align-self:stretch`) */
  .story > .edu-t{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;margin:0;padding:36px 0 0;font:800 28px/1.1 var(--display);letter-spacing:-.015em;color:var(--orange);text-wrap:balance}
  .story > .step{align-self:stretch;border-top:0;padding:56px 0 32px}
  .story > #start{padding-top:22px}
  .story > section.flip-band{align-self:stretch;border-top:0}
  .story > .step::before,.story > .flip-band::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:calc(-1 * var(--gutter));right:calc(-1 * var(--gutter))}
  [data-step-mark="line"] > .step::before,[data-step-mark="line"] > .flip-band::before{border-top:1px solid var(--line)}
  [data-step-mark="line"] > #start::before{border-top:0}
  [data-step-mark="bands"] > #albums::before,[data-step-mark="bands"] > #playlists::before{background:#101014}
  [data-step-mark="bands"] .v4-motif,[data-step-mark="bands"] .ranked{border-color:rgba(255,255,255,.24)}
  .step .kicker{color:var(--muted)}
  .step .kicker .n{font:800 30px/1 var(--display);letter-spacing:0;margin:0 3px;vertical-align:-4px;color:#fff}
  .step h3.t{font-size:24px;margin-bottom:12px}
  .step .door{color:#fff;text-decoration:underline;text-underline-offset:4px}
  .flip-band .fb-title{color:#d6d6dc}
  .v4-lead{display:block;margin:20px 0 0}
  .v4-motif{width:min(100%,420px);height:200px;margin:0}
  .ranked{margin-top:20px}
  /* «Na caixa do The Album Blender»: the browser's own sideways scroll, snapping, the next album's edge in sight; it never moves by itself */
  .story > .shelf-sec{display:block;align-self:stretch;min-width:0;padding:36px 0 28px}
  .shelf-t{font:800 28px/1.1 var(--display);letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}
  .sw{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 var(--gutter);overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 calc(-1 * var(--gutter))}
  .sw::-webkit-scrollbar{display:none}
  .sw:focus-visible{outline-offset:-3px}
  .shelf{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:14px;width:max-content;margin:0;padding:6px var(--gutter) 8px;list-style:none} /* a grid of fixed columns: its width is the same in every engine (as a flex row WebKit made it 438 px longer than its albums) */
  .al{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-snap-align:start} /* relative: the button's screen-reader text stays inside the row, or it would make the page wider */
  .al img{display:block;width:150px;height:150px;border-radius:3px;box-shadow:0 12px 26px rgba(0,0,0,.6)}
  .al b{font:700 14px/1.25 var(--display);color:#fff;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:35px}
  .al-by{font-size:13px;line-height:1.3;color:var(--muted)}
  .al .am{box-sizing:border-box;width:100%;justify-content:center;gap:4px;padding:0 2px;font-size:12px;letter-spacing:-.03em}
  .al .am .mk{flex:none;width:14px;height:14px;border-radius:4px;font-size:9px}
  .sw-ctl{display:flex;justify-content:flex-end;gap:12px;margin-top:10px}
  .sw-ctl button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.28);background:rgba(10,10,12,.6);color:#d6d6dc;cursor:pointer;padding:0}
  .sw-ctl button[aria-disabled="true"]{opacity:.35;cursor:default}
  .sw-ctl svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  html:not(.js) .sw-ctl{display:none}
}

  <section class="step" id="playlists" data-track="playlists" aria-labelledby="t-playlists">
    <p class="kicker" data-i18n="k.playlists" data-num></p>
    <h3 class="t" id="t-playlists" data-i18n="t.playlists"></h3>
    <p data-i18n="p.playlists"></p>
    <a class="door only-in" href="/saved-playlists"><span data-i18n="d.playlists"></span> <span aria-hidden="true">→</span></a>
    <div class="v4-lead"><div class="v4-motif m-pl" aria-hidden="true">
        <ul class="p-list"><li class="p1"><span class="mos"><i></i><i></i><i></i><i></i></span><b></b><s></s><span class="p-play">▶</span></li><li class="p2"><span class="mos"><i></i><i></i><i></i><i></i></span><b></b><s></s></li></ul>
        <span class="p-out"><span class="ex ex-sp">Spotify <i>✓</i></span><span class="ex ex-am">Apple Music <i>✓</i></span></span>
      </div></div>
  </section>

  <section class="step" id="inventory" data-track="inventory" aria-labelledby="t-inventory">
    <p class="kicker" data-i18n="k.inventory" data-num></p>
    <h3 class="t" id="t-inventory" data-i18n="t.inventory"></h3>
    <p data-i18n="p.inventory"></p>
    <a class="door only-in" href="/inventory"><span data-i18n="d.inventory"></span> <span aria-hidden="true">→</span></a>
    <div class="v4-lead"><div class="v4-motif m-inv" aria-hidden="true">
        <span class="i-row">
          <span class="i-vinyl"><i class="i-disc"></i><i class="i-sleeve"></i></span>
          <span class="i-stack"><span class="i-tape"><i class="i-reel"></i><i class="i-reel"></i></span><span class="i-cd"><i class="i-cdd"></i></span></span>
        </span>
        <i class="i-plank"></i>
      </div></div>
  </section>

  <section class="shelf-sec" id="crate-shelf" aria-labelledby="t-shelf">
    <h2 class="shelf-t" id="t-shelf" data-i18n="shelf.title"></h2>
    <div class="sw" id="shelf" tabindex="0" role="group" aria-label="" data-i18n-aria="shelf.aria">
      <ol class="shelf">
          <!--splash:shelf-->
      </ol>
    </div>
    <div class="sw-ctl">
      <button type="button" id="shelf-prev" aria-label="" data-i18n-aria="shelf.prev"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <button type="button" id="shelf-next" aria-label="" data-i18n-aria="shelf.next"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </section>

  <section class="final" id="end" data-track="end" aria-labelledby="t-end">
    <div class="only-out">
      <h2 class="t" id="t-end" data-i18n="e.title"></h2>
      <p data-i18n="e.what"></p>
      <div class="ctas"><a class="btn btn-primary" href="/start"><span data-i18n="openapp"></span> <span class="eqi" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a><a class="btn btn-ghost" href="/start?signin" data-i18n="signin"></a></div>
    </div>
    <div class="only-in">
      <h2 class="t" data-i18n="ei.title"></h2>
      <div class="ctas"><a class="btn btn-primary" href="/start"><span data-i18n="m.start"></span> <span class="eqi" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a></div>
    </div>
    <div class="b2-fire" aria-hidden="true"><div class="glow"></div><canvas id="embers-b2"></canvas></div>
  </section>

  <div class="stage-col">
    <figure class="stage" id="stage" aria-label="" data-i18n-aria="stage.aria">
      <div class="scene" id="scene">
        <div class="glow" aria-hidden="true"></div>
        <canvas class="embers" id="embers" aria-hidden="true"></canvas>
        <button class="motion-icon" id="motion" type="button" aria-pressed="false" aria-label="" title="" data-i18n-aria="pause" data-i18n-title="pause" hidden>
          <svg class="i-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
          <svg class="i-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></svg>
        </button>
        <div class="crate-css" id="crate-css">
          <div class="box" id="box">
        <!--splash:covers-->
          </div>
          <div class="front" aria-hidden="true"></div>
        </div>
        <!--splash:stage-tag-->
      </div>
      <figcaption class="caption" id="caption">
        <!--splash:caption-->
      </figcaption>
    </figure>
  </div>
</main>

<footer><div class="wrap">
  <div class="row"><span>The Album Blender</span><nav aria-label="" data-i18n-aria="footer.aria"><a class="only-out" href="/start" data-i18n="openapp"></a><a class="only-out" href="/start?signin" data-i18n="signin"></a><a class="only-in" href="/start" data-i18n="m.start"></a><a class="only-in" href="/albums" data-i18n="m.albums"></a><a class="only-in" href="/blend" data-i18n="m.blend"></a><a class="only-in" href="/saved-playlists" data-i18n="m.playlists"></a><a class="only-in" href="/inventory" data-i18n="m.inventory"></a></nav></div>
  <!--splash:credit-->
</div></footer>

<script type="module" src="/splash/main.js"></script>
</body>
</html>
