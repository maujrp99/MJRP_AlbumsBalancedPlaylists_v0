# Runs the unit tests on every push and pull request. It deploys nothing.
#
# Production is published from the owner's machine, by scripts/deploy-site.sh and
# scripts/deploy-server.sh (docs/manual/00_Deployment_and_Setup.md). This repository
# holds no deploy secret, so a deploying job here could only fail or ship a broken
# site (the build needs VITE_SPOTIFY_CLIENT_ID, which is not in the repository).
#
# The suite needs no secret and no network: it is the same `npx vitest run` the
# deploy scripts run before sending anything.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The Node the tests are run with on the owner's machine. The server image runs on 24
          # (server/Dockerfile, ADR-0020).
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Types (the React screens, F83)
        run: npm run typecheck

      - name: Code check (lint)
        run: npx eslint . --quiet

      - name: Unit tests
        run: npx vitest run

      # The rules test runs in the Firestore emulator, as its own step (F82 TASK-05): it needs Java
      # and the Firebase CLI, and the default suite leaves it out.
      - name: Setup Java (for the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rules test (Firestore emulator)
        run: npm install -g firebase-tools@15.36.0 && npm run test:rules
