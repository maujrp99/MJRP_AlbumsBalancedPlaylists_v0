mjrp_harness:
  version: "1.0"
  profile: code-app          # code-app | content | meta
  # id_prefix: XX  # só projeto aninhado no repositório de outro (apps/<app>/): prefixo de resultado, épico, NFR e ADR (ADR-0020 D.3)
  process_level: standard     # minimal | standard | full
  context: lazy              # eager | lazy
  orchestration: assisted    # assisted | autonomous
  # project_palette:         # ADR-0022: a cor deste projeto no Control Center - um par da biblioteca de paletas (kernel design/palette-library.md); a bootstrap pergunta
  #   light: L1              # L1-L8; projeto só escuro: omita esta linha
  #   dark: D1               # D1-D5; projeto só claro: omita esta linha
  gates: []                # [] por padrão: o humano aprova o «Pronto para construir» (os requisitos Ready); acrescente spec | plan | tasks para aprovar também
  gate_sla_days: 14
  gates_open: []
  requirements:
    format: story           # story | use-case | ears - a mjrp-writing-reqs lê daqui
    stale_days: 14                            # In progress sem feature aberta nem atividade há N dias - o sensor do grafo acusa
  environment:
    setup: nenhum             # comando de setup, ou 'nenhum' se não há pré-requisito
    runtime: ""               # ex.: 'python3, node' - preencha quando a stack existir
  conformance:                # ADR-0019: a conformidade canônica do projeto
    applied: [CM-0029, CM-0047, CM-0002, CM-0017, CM-0025, CM-0041, CM-0045, CM-0003, CM-0046, CM-0078, CM-0051, CM-0077, CM-0030, CM-0048, CM-0032, CM-0053, CM-0072, CM-0071, CM-0033, CM-0054, CM-0012, CM-0024, CM-0076, CM-0085]               # as notas de migração (CM-NNNN) cumpridas - a bootstrap, modo conform, acrescenta
    received: {}              # <item>@<versão>: data - escrito só pelo new_project.py --refresh-kernel; a carência conta daí
  screen: [public/]          # onde mora a tela (prefixos, caminhos ou globs) - o A2 do doctor e o hook pre-merge-commit leem daqui
  sensors:
    lint:  "npm run lint"
    test:  "npm test -- --run"
    build:  "npm run build"
    # visual:                 # projeto com tela e referência visual aprovada (info-arch.md § Protótipos aprovados): o doctor (A2) exige
    #   cmd: "node mjrp-scripts/visual_parity/run.mjs web/visual.config.mjs"   # o kit do kernel (só em projeto com tela)
    #   config: web/visual.config.mjs   # o config visual do projeto: referência (viva ou estática), cenários, condições
    #   when: pre-merge         # só o visual pode: roda na reconferência visual; o hook pre-merge-commit cobra o relatório
  kernel:                    # as páginas da wiki do harness que este projeto carrega (I5)
    version: 2026-10-28
    source: a194e58f2
    pages: [base-concept, vision-document, memory-architecture, context-vs-memory, project-profiles, terms, doctor, adr-practice, harness-concept, harness-elements, engineering-canon, spec-kit, agents-agentic-concepts, graph-engineering-concept, hooks-concept, loop-engineering-concept, harness-kaizen, design-canon, requirements-graph, knowledge-graph-concept, linked-notes-concept, git-governance, spreadsheet-standard, product-discovery, pdlc-loops, conformance-notes, palette-library, sketch-vs-prototype, architecture-review, design-patterns]
    vendored: [PRINCIPLES.md, mjrp-scripts/doctor.py, mjrp-scripts/_boot.py, mjrp-scripts/_clock.py, mjrp-scripts/_context.py, mjrp-scripts/_contract.py, mjrp-scripts/_doctor_budgets.py, mjrp-scripts/_doctor_contract.py, mjrp-scripts/_doctor_docs.py, mjrp-scripts/_doctor_kernel.py, mjrp-scripts/_doctor_memory.py, mjrp-scripts/_doctor_repo.py, mjrp-scripts/_doctor_sensors.py, mjrp-scripts/_doctor_skills.py, mjrp-scripts/_fm.py, mjrp-scripts/_git.py, mjrp-scripts/_now_shape.py, mjrp-scripts/_pathclass.py, mjrp-scripts/_report.py, mjrp-scripts/_run.py, mjrp-scripts/_safe.py, mjrp-scripts/_skills.py, mjrp-scripts/structure_rules.json, mjrp-scripts/structure_check.py, mjrp-scripts/path_guard.py, mjrp-scripts/hooks/pre-commit, mjrp-scripts/session_lease.py, mjrp-scripts/prototype_inventory.py, mjrp-scripts/retired_names_check.py, mjrp-scripts/retired_skills.json, mjrp-scripts/daily_checks.py, mjrp-scripts/log_entry_check.py, mjrp-scripts/hooks/commit-msg, mjrp-scripts/hooks/catalog_marks_guard.py, mjrp-scripts/hooks/human_valves_guard.py, mjrp-scripts/hooks/deletion_guard.py, mjrp-scripts/prototype_sync_check.py, mjrp-scripts/session_journal.py, mjrp-scripts/requirements_graph_check.py, mjrp-scripts/requirements_graph_rules.json, mjrp-scripts/req_file_names.py, mjrp-scripts/visual_gate.py, mjrp-scripts/conformance_check.py, mjrp-scripts/canonical_catalog.json, mjrp-scripts/product_structure_check.py, mjrp-scripts/feature_history_check.py, mjrp-scripts/evidence_folder_check.py, mjrp-scripts/uat_tracks_check.py, mjrp-scripts/acceptance_issue_ok.py, mjrp-scripts/requirement_evidence.py, mjrp-scripts/status_sync.py, mjrp-scripts/status_sync_daily.py, mjrp-scripts/retro_step_check.py, mjrp-scripts/sdd_shape_check.py, mjrp-scripts/uat_readable_check.py, mjrp-scripts/loop.py, mjrp-scripts/pdlc_vocabulary_check.py, mjrp-scripts/record_shapes_check.py, mjrp-scripts/report_types.json, mjrp-scripts/report_types_check.py, mjrp-scripts/content_audit_check.py, mjrp-scripts/audit_questi